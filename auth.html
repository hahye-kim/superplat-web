<style>
/* ═══════════════════════════════════════════════════════════════════
   SuperPlat — HOME
   시안: PC 1920 / Mobile 375 (Figma) · Hero reveal: index-standalone_2_1.html
   ───────────────────────────────────────────────────────────────────
   구성
     00 Reset / Tokens
     01 Layout primitives
     02 Header + Mobile drawer
     03 Hero (dual-image activation + brush reveal)
     04 Character marquee
     05 World carousel
     06 Cinematic scroll
     07 Community cards
     08 Final CTA + Footer
     09 Reveal / reduced-motion
   ═══════════════════════════════════════════════════════════════════ */

/* ── 00 Reset ──────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body,h1,h2,h3,p,figure,ul,li{margin:0;padding:0}
ul{list-style:none}
/* ⚠️ height:auto 필수 — width/height 속성이 붙은 img 에 CSS width 만 주면
   브라우저가 속성 height 를 그대로 써서 이미지가 눌립니다 (CTA 캐릭터 찌그러짐 원인) */
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #191F28;outline-offset:3px;border-radius:4px}
.hero :focus-visible,.cta :focus-visible{outline-color:#fff}
.br-m{display:none}
@media (max-width:767px){.br-m{display:inline}}
.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 00 Tokens ─────────────────────────────────────────────────── */
:root{
  /* color — 시안 실측 (title #191F28 = TDS grey900) */
  /* ── 테마 채널 토큰 ────────────────────────────────────────────────
     사이트 전체의 "잉크색 반투명"(테두리 · divider · 보조 텍스트 · 미세 배경)은
     전부 rgba(var(--ink-rgb), α) 형태로만 씁니다. Dark 에서 이 채널 하나만
     바꾸면 수백 개 규칙이 한 번에 따라옵니다. 알파(=계층)는 그대로 유지됩니다.
     --line-rgb 는 border / outline 전용 채널입니다 (그림자·이미지 DIM 은 제외). */
  --ink-rgb:23,26,33;
  --line-rgb:0,0,0;

  --ink:#191F28;
  --ink-soft:#333B45;
  /* ⚠️ Light 보조 텍스트 계단을 한 단계씩 올렸습니다.
     실측: 예전 --body-2nd(.46) 는 흰 배경에서 2.97 : 1 로 WCAG AA(4.5)에
     한참 못 미쳤고, 사이트 전체의 캡션 · 메타 · 도움말이 이 토큰을 씁니다.
       .46 → 2.97   .64 → 5.22 ✔ (연회색 표면에서도 4.9 이상)
       .62 → 4.88   .70 → 6.42 ✔
       .68 → 5.83   .78 → 7.78 ✔
     세 단계의 순서와 간격은 그대로 유지하면서 전부 AA 를 넘깁니다.
     Dark 는 sp-theme.css 에서 이미 5.9 : 1 이상이라 건드리지 않았습니다. */
  --body:rgba(var(--ink-rgb),.70);
  --body-2nd:rgba(var(--ink-rgb),.64);
  --body-2:rgba(var(--ink-rgb),.78);
  --white:#fff;
  --bg:#fff;
  --bg-gray:#F5F5F6;   /* Section 03 */
  --card:#F7F7F7;      /* Section 05 card default */
  --card-left:#DAE6FF; /* Section 05 hover A */
  --card-right:#FFE9C3;/* Section 05 hover B */
  --band:#F2F3F6;      /* Final CTA band */
  --line:rgba(var(--line-rgb),.07);
  --accent:#FF7A18;    /* hero activation glow (원본 이미지의 orange) */

  /* layout */
  --gutter:clamp(20px, 4vw, 80px);
  --container:min(1400px, 100% - 2 * var(--gutter));
  --container-wide:min(1440px, 100% - 2 * var(--gutter));
  --header-h:clamp(66px, calc(56px + 1.25vw), 80px);   /* 1920:80 · 1600:76 · 1440:74 · 1280:72 · 1024:68.8 · 768:66 */
  --r-card:16px;
  --r-media:20px;
  /* 콘텐츠 카드 슬롯 공통 라운드 — World & IP 카드가 이 토큰 하나만 씁니다.
     같은 카드 컴포넌트를 다른 페이지에서 재사용할 때도 이 값을 그대로 쓰면
     카드마다 라운드가 달라지는 일이 생기지 않습니다. (PC 24 / 모바일 16) */
  --radius-card:24px;

  /* ══ SPACING TOKENS ══════════════════════════════════════════════
     ⚠️ 섹션·블록 여백은 반드시 아래 토큰만 씁니다. 임의의 margin 금지.

     token                @375  @1024  @1440  @1920  용도
     space-section-sm      76     80     112    148   보조 섹션 (CTA 하단 등)
     space-section-md      96     96     135    180   표준 섹션
     space-section-lg     112    118    166    220   스토리텔링 섹션
     space-section-xl     124    128    180    240   cinematic pause
     space-content-sm      12     14     18      18   라벨 ↔ 값
     space-content-md      20     22     30      36   제목 ↔ 본문
     space-content-lg      36     40     56      72   텍스트 ↔ 비주얼          */
  --space-section-sm:clamp(76px, 7.8vw, 148px);
  --space-section-md:clamp(96px, 9.4vw, 180px);
  --space-section-lg:clamp(112px, 11.5vw, 220px);
  --space-section-xl:clamp(124px, 12.5vw, 240px);
  --space-content-sm:clamp(12px, 1vw, 18px);
  --space-content-md:clamp(20px, 2.1vw, 36px);
  --space-content-lg:clamp(36px, 3.9vw, 72px);
  /* 의미 기반 별칭 — 섹션에서는 이 이름을 씁니다 */
  --space-title-to-body:var(--space-content-md);
  --space-text-to-media:var(--space-content-lg);

  /* ── motion tokens ──────────────────────────────────────────────
     사이트 전체 애니메이션은 이 6개 값만 씁니다. 개별 하드코딩 금지.
       fast     220~300  micro interaction (hover / press)
       normal   450~650  UI 상태 전환
       reveal   700~900  텍스트·카드 등장
       cinematic 900~1200 큰 비주얼
     motion hierarchy: headline > body > image > cards > buttons > 장식(정지) */
  --ease:cubic-bezier(.16,1,.3,1);       /* primary */
  --ease-soft:cubic-bezier(.22,1,.36,1); /* subtle  */
  --t-fast:260ms;
  --t-normal:560ms;
  --t-reveal:820ms;
  --t-cine:1050ms;
  --stagger:80ms;
  --rv-y:28px;                            /* reveal 이동 거리 */
  --t-micro:var(--t-fast);                /* 기존 사용처 호환 */
  --t-ui:360ms;

  /* ══ TYPOGRAPHY TOKENS ═══════════════════════════════════════════
     Pretendard 하나로 운영하는 공통 스케일입니다.
     ⚠️ 섹션에서 font-size 를 새로 만들지 말고 반드시 이 토큰을 재사용하세요.
        (.t-* 유틸리티 클래스로도 그대로 쓸 수 있습니다)

     token           @375  @1440  @1920   용도
     display-xl       40     72     84    Hero
     display-lg       34     54     64    영상 statement
     heading-1        30     48     56    섹션 타이틀
     heading-2        24     34     40    서브 섹션 / Final CTA
     heading-3        20     24     28    카드·피처 타이틀
     title            19     22     24    공간명
     body-lg          16     18     20    섹션 본문
     body-md          15     17     18    카드 본문
     body-sm          13     14     15    보조 설명
     caption          12     13     13    메타 / 카운터              */
  --font-display-xl:clamp(40px, 5vw, 84px);
  --font-display-lg:clamp(34px, calc(24px + 2.083vw), 64px);
  --font-heading-1:clamp(33px, calc(24px + 1.667vw), 56px);   /* @375 33 · @1440 48 · @1920 56 */
  --font-heading-2:clamp(28px, calc(17px + 1.2vw), 40px);
  --font-heading-3:clamp(20px, calc(13.5px + .75vw), 28px);
  --font-title:clamp(19px, calc(15.5px + .44vw), 24px);
  --font-body-lg:clamp(16px, calc(12.6px + .385vw), 20px);
  --font-body-md:clamp(15px, calc(12.9px + .265vw), 18px);
  --font-body-sm:clamp(13px, calc(11.5px + .18vw), 15px);
  --font-caption:clamp(12px, calc(11.3px + .09vw), 13px);
  --font-nav:clamp(14px, .8vw, 15px);
  --font-nav-2:clamp(13px, .74vw, 14px);
  --font-btn:clamp(15px, .88vw, 17px);

  /* 자간 — 한글 제목은 과하게 조이지 않습니다 */
  --ls-display:-.04em;
  --ls-heading:-.03em;
  --ls-body:-.012em;

  /* 기존 이름 호환 (내부 참조용) */
  --fs-h1:var(--font-display-xl);
  --fs-h2:var(--font-heading-1);
  --fs-stmt:var(--font-display-lg);
  --fs-feature:var(--font-heading-3);
  --fs-desc:var(--font-body-lg);
  --fs-body:var(--font-body-md);
  --fs-lead:var(--font-body-lg);
  --fs-nav:var(--font-nav);
  --fs-label:var(--font-caption);
}

/* 모바일 — 같은 motion language 를 유지하되 이동 거리·간격만 가볍게 (§27) */
@media (max-width:767px){
  :root{--rv-y:20px;--stagger:60ms;--t-cine:900ms;--radius-card:16px}
}

/* 2K·4K — 콘텐츠가 우표처럼 작아 보이지 않도록 한 단계만 완만하게 올립니다.
   (1400 기준은 유지, 상한만 1600. 이미지/타이포가 무한정 커지지는 않습니다) */
@media (min-width:2200px){
  :root{
    /* 콘텐츠 폭은 1400 으로 고정하고, 남는 공간은 전부 여백으로 흘려보냅니다 */
    --gutter:clamp(96px, 5vw, 260px);
    --container:min(1400px, 100% - 2 * var(--gutter));
    --container-wide:min(1440px, 100% - 2 * var(--gutter));
    --cine-max:1600px;
    --font-display-xl:clamp(84px, 2.6vw, 100px);
    --font-display-lg:clamp(64px, 2vw, 76px);
    --font-heading-1:clamp(56px, 1.75vw, 66px);
    --font-heading-2:clamp(40px, 1.25vw, 48px);
    --font-heading-3:clamp(28px, .88vw, 34px);
    --font-title:clamp(24px, .75vw, 29px);
    --font-body-lg:clamp(20px, .62vw, 24px);
    --font-body-md:clamp(18px, .56vw, 21px);
    --font-body-sm:clamp(15px, .47vw, 18px);
    --font-caption:clamp(13px, .41vw, 16px);
    --font-nav:clamp(15px, .47vw, 18px);
    --font-nav-2:clamp(14px, .44vw, 17px);
    --font-btn:clamp(17px, .53vw, 20px);
    --header-h:80px;                       /* 2200+ 에서도 90px 을 넘기지 않습니다 */
  }
}

body{
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Apple SD Gothic Neo',sans-serif;
  font-size:var(--font-body-md);
  line-height:1.65;
  color:var(--ink);
  background:var(--bg);
  word-break:keep-all;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:'tnum' 0;
}
body.is-locked{overflow:hidden;touch-action:none}
/* 모바일 — 인접 섹션 합산 여백이 한 화면을 덮지 않도록 한 단계 압축 */
@media (max-width:767px){
  :root{
    --space-section-sm:72px;
    --space-section-md:92px;          /* 섹션 상단 88~104 */
    --space-section-lg:96px;
    --space-section-xl:108px;
    --space-content-md:clamp(20px, 5.6vw, 24px);   /* 제목 → 본문 20~24 */
    --space-content-lg:clamp(36px, 10.4vw, 44px);  /* 본문 → 비주얼 36~44 */
  }
}

/* ── 01 Layout primitives ──────────────────────────────────────── */
/* ── Typography utilities — 어디서든 이 클래스만으로 위계를 맞출 수 있습니다 ── */
.t-display-xl{font-size:var(--font-display-xl);font-weight:700;line-height:1.12;letter-spacing:var(--ls-display)}
.t-display-lg{font-size:var(--font-display-lg);font-weight:700;line-height:1.15;letter-spacing:-.035em}
.t-heading-1{font-size:var(--font-heading-1);font-weight:700;line-height:1.15;letter-spacing:var(--ls-heading)}
.t-heading-2{font-size:var(--font-heading-2);font-weight:700;line-height:1.2;letter-spacing:-.025em}
.t-heading-3{font-size:var(--font-heading-3);font-weight:700;line-height:1.3;letter-spacing:-.02em}
.t-title{font-size:var(--font-title);font-weight:700;line-height:1.35;letter-spacing:-.02em}
.t-body-lg{font-size:var(--font-body-lg);font-weight:400;line-height:1.65;letter-spacing:var(--ls-body)}
.t-body-md{font-size:var(--font-body-md);font-weight:400;line-height:1.65;letter-spacing:var(--ls-body)}
.t-body-sm{font-size:var(--font-body-sm);font-weight:400;line-height:1.6;letter-spacing:-.008em}
.t-caption{font-size:var(--font-caption);font-weight:500;line-height:1.5;letter-spacing:0}
/* 숫자 UI — 폭이 흔들리지 않게 */
.t-num{font-variant-numeric:tabular-nums;font-weight:500}

.wrap{width:var(--container);margin-inline:auto}
.wrap--wide{width:var(--container-wide);margin-inline:auto}

.section-head{max-width:none}
.section-title{
  font-size:var(--font-heading-1);
  line-height:1.15;
  letter-spacing:var(--ls-heading);
  font-weight:700;
  color:var(--ink);
}
.section-desc{
  margin-top:var(--space-title-to-body);   /* 제목 ↔ 본문 20 → 36px */
  max-width:700px;                      /* 본문은 넓게 읽히되 700px 이내 */
  font-size:var(--font-body-lg);
  font-weight:400;
  line-height:1.65;
  color:var(--body);
  letter-spacing:var(--ls-body);
}
.section-desc br{display:inline}
@media (max-width:767px){
  /* 제목은 시안대로 2줄 — 화면마다 줄바꿈이 달라지지 않게 폭을 잡아 둡니다 */
  .section-title{line-height:1.18;max-width:15ch}
}

/* 섹션 세로 리듬 — 1920 시안 실측을 vw로 환산 */
/* 섹션 세로 리듬 — 기계적으로 같은 값이 아니라 콘텐츠 무게에 따라 3단계 */
.s-white{padding-block:var(--space-section-md) var(--space-section-lg)}   /* 캐릭터 */
.s-gray{background:var(--bg-gray);padding-block:var(--space-section-md) var(--space-section-lg)} /* 공간 */
.s-cards{padding-block:var(--space-section-lg) var(--space-section-md)}   /* 커뮤니티 */

/* ── 02 Header ─────────────────────────────────────────────────── */
.header{
  position:fixed;
  inset:0 0 auto;
  z-index:200;
  /* SMART HEADER — 스크롤 방향에 따라 위로 접힙니다.
     ⚠️ display / DOM 조작이 아니라 transform 만 씁니다. fixed 오버레이라
        본문 레이아웃은 그대로여서 layout shift(CLS)가 생기지 않습니다. */
  transform:translate3d(0,0,0);
  will-change:transform;
  transition:background-color var(--t-ui) var(--ease), box-shadow var(--t-ui) var(--ease),
             backdrop-filter var(--t-ui) var(--ease), transform 320ms var(--ease);
}
html .header.is-hidden{transform:translate3d(0,-100%,0)}
@media (prefers-reduced-motion:reduce){
  .header{transition-duration:1ms, 1ms, 1ms, 1ms}
}
.header__inner{
  /* ⚠️ 본문과 같은 1400 Grid — 헤더만 1440 을 쓰면 로고·CTA 가 본문보다 20px 씩
     바깥으로 밀려 나갑니다(실측). 같은 축을 쓰도록 --container 로 맞췄습니다. */
  width:var(--container);
  margin-inline:auto;
  height:var(--header-h);
  /* 1fr · auto · 1fr — 좌우 칸이 같은 폭이라 메뉴가 컨테이너 정중앙에 놓입니다.
     (로고 폭과 유틸리티 폭이 달라도 메뉴 축은 흔들리지 않습니다) */
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  column-gap:clamp(20px,2vw,40px);
}
.header__logo{grid-column:1;justify-self:start;display:flex;align-items:center;min-height:44px}
.header__logo img{
  /* ⚠️ 높이가 아니라 폭 기준입니다.
     원본 366×132 안에 좌우 15/12px, 상하 9px 의 투명 여백이 있어서
     "보이는 로고 폭"은 지정 폭의 약 92.6% 입니다.
     106px → 실제 시각 폭 98px (요청 90~104 구간). 비율은 건드리지 않습니다. */
  width:clamp(99px, calc(83px + 2.083vw), 123px);
  height:auto;
  transition:filter var(--t-ui) var(--ease);
}
.header__nav{grid-column:2;justify-self:center;display:flex;align-items:center;gap:clamp(28px, calc(4px + 2.083vw), 44px)}   /* 1920:44 · 1600:37 · 1440:34 · 1280:30.7 · 1024:28 */
.header__link{
  position:relative;
  font-size:clamp(14px, calc(12.5px + .156vw), 15.5px);  /* 1920:15.5 · 1440:14.8 · 1280:14.5 · 1024:14.1 */
  font-weight:600;                                       /* SemiBold — 로고보다 한 단계 낮은 위계 */
  letter-spacing:-.01em;
  color:var(--white);
  padding:6px 2px;
  transition:opacity var(--t-micro) var(--ease), color var(--t-ui) var(--ease);
}
.header__link::after{
  content:'';
  position:absolute;
  left:2px;right:2px;bottom:2px;
  height:1px;
  background:currentColor;
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform 220ms var(--ease);
}
.header__link:hover{opacity:.72}
.header__link:hover::after{transform:scaleX(1)}

/* ⚠️ 헤더 텍스트에는 그림자를 쓰지 않습니다 (요청).
   사진 위 가독성은 Weight 600 · 흰색 · 스크롤 후 흰 배경 대비로만 확보합니다.
   Hover / Active / Sticky / Smart Header 어느 상태에서도 그림자가 생기지 않도록
   아래에서 명시적으로 none 을 못 박아 둡니다. */
.header,.header *{text-shadow:none}
.header__link,.header__link:hover,.header__link:active,.header__link:focus,
.header__icon,.header__icon svg,.header__burger,.header__burger span,
.header__langmenu button,.btn-download,.btn-download:hover,
.header__login,.sp-av__btn{text-shadow:none;filter:none}
/* 로고 이미지의 반전 필터는 그대로 둡니다 (그림자가 아니라 색 처리입니다) */
.header.is-scrolled .header__logo img,.is-menu .header__logo img{filter:invert(1) brightness(.16)}

.header__actions{grid-column:3;justify-self:end;display:flex;align-items:center;gap:clamp(12px,1.05vw,20px)}
.header__icon{
  width:42px;height:42px;              /* 히트 영역 — 아이콘은 작게, 누를 곳은 넉넉하게 */
  display:grid;place-items:center;
  border-radius:999px;
  color:var(--white);
  transition:background-color var(--t-micro) var(--ease), color var(--t-ui) var(--ease), opacity var(--t-micro) var(--ease);
}
.header__icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
/* ── Header utility icons — Bootstrap Icons(fill 기반) ────────────────
   ⚠️ Bootstrap Icons 는 stroke 가 아니라 fill 로 그려집니다.
      기존 stroke 규칙을 그대로 두면 아이콘이 보이지 않으므로 여기서 뒤집습니다.

   Optical size — "박스 크기"가 아니라 "실제로 보이는 크기"를 맞춥니다.
     globe2      path 가 16 뷰박스를 꽉 채움  → 보이는 크기 = 박스 크기
     person-fill path bbox 가 12/16 = 75%    → 박스 × 0.75 가 보이는 크기
   그래서 두 아이콘의 박스 크기를 일부러 다르게 줍니다.
     Desktop  globe 18.5px      · person 24px(=18px 로 보임)
     Mobile   globe 20px        · person 26.5px(=19.9px 로 보임)          */
.header__icon .ic{stroke:none;fill:currentColor;display:block}
.header__icon .ic--globe{width:18.5px;height:18.5px}
.header__icon .ic--person{width:24px;height:24px}
.header__icon:hover{background:rgba(255,255,255,.14)}
.header__lang{position:relative}
/* 언어 드롭다운 — 공통 Dropdown System(assets/sp-ui.js)의 surface / option 토큰을
   그대로 씁니다. 헤더 메뉴와 페이지 안의 Select 메뉴가 같은 표면·같은 리듬을 갖도록.
   토큰이 없는 환경(스크립트 미로딩)에서도 기존 값으로 떨어지게 fallback 을 둡니다. */
.header__langmenu{
  position:absolute;top:calc(100% + 8px);right:0;
  min-width:118px;padding:var(--sp-menu-pad,7px);
  background:var(--sp-menu-bg,#fff);border-radius:var(--sp-menu-r,14px);
  box-shadow:var(--sp-menu-sh,0 10px 30px rgba(0,0,0,.08), 0 0 0 1px rgba(var(--ink-rgb),.05));
  opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity var(--sp-pop-out,160ms) var(--sp-ease,cubic-bezier(.16,1,.3,1)),
             transform var(--sp-pop-out,160ms) var(--sp-ease,cubic-bezier(.16,1,.3,1)),
             visibility var(--sp-pop-out,160ms);
}
.header__lang.is-open .header__langmenu{
  opacity:1;visibility:visible;transform:none;
  transition-duration:var(--sp-pop-in,220ms);
}
.header__langmenu button{
  display:flex;align-items:center;width:100%;text-align:left;
  min-height:var(--sp-opt-h,42px);
  padding:0 12px;border-radius:var(--sp-opt-r,9px);
  font-size:var(--font-nav-2);font-weight:500;color:var(--sp-ink,var(--ink));
  transition:background-color var(--t-micro) var(--ease);
}
.header__langmenu button:hover{background:var(--sp-opt-hover,rgba(var(--ink-rgb),.045))}
.header__langmenu button[aria-current='true']{font-weight:700;background:var(--sp-opt-sel,rgba(var(--ink-rgb),.06))}

.btn-download{
  display:inline-flex;align-items:center;justify-content:center;
  height:clamp(38px, calc(32px + .52vw), 42px);   /* 1920:42 · 1440:39.5 · 1024:38 */
  padding:0 clamp(16px,1.15vw,22px);
  border-radius:999px;                            /* pill — height 42 기준 radius 21 */
  background:var(--white);
  color:var(--ink);
  font-size:clamp(14px, calc(12.5px + .13vw), 15px);
  font-weight:600;
  letter-spacing:-.01em;
  white-space:nowrap;
  transition:background-color var(--t-ui) var(--ease), transform var(--t-micro) var(--ease), color var(--t-ui) var(--ease);
}
.btn-download:hover{transform:scale(1.015);background:#EFEFEF}
.btn-download:active{transform:scale(.97)}

/* 스크롤 후 — 흰 배경 + blur + 다크 텍스트 */
.header.is-scrolled{
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  box-shadow:0 1px 0 rgba(0,0,0,.06);          /* 강한 회색 선 대신 아주 미세한 divider */
}
.header.is-scrolled .header__logo img{filter:invert(1) brightness(.16)}
.header.is-scrolled .header__link,
.header.is-scrolled .header__icon,
.header.is-scrolled .header__burger{color:var(--ink)}
.header.is-scrolled .header__icon:hover{background:rgba(0,0,0,.05)}
.header.is-scrolled .btn-download{background:var(--ink);color:#fff}
.header.is-scrolled .btn-download:hover{background:#333B45}

/* 드로어가 열리면 헤더는 흰 배경 위에 놓입니다 — 로고·햄버거를 다크로 */
.is-menu .header{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.is-menu .header__logo img{filter:invert(1) brightness(.16)}
.is-menu .header__link,
.is-menu .header__icon,
.is-menu .header__burger{color:var(--ink)}

/* 햄버거 — 44×44 히트 영역, 실제 선은 24×1.75px / gap 6px */
.header__burger{
  display:none;
  width:44px;height:44px;
  margin-right:-10px;
  /* ⚠️ grid + place-items 는 암시적 row 가 44px 안에서 stretch 되어
     선 간격이 6px 이 아니라 16px 이 됩니다 → X 변환이 어긋납니다.
     flex column + gap 으로 간격을 결정론적으로 고정합니다. */
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--white);
  border-radius:12px;
  transition:background-color var(--t-micro) var(--ease), color var(--t-ui) var(--ease);
}
.header__burger:hover,
.header__burger:active{background:rgba(255,255,255,.12)}
.header.is-scrolled .header__burger:hover,
.header.is-scrolled .header__burger:active,
.is-menu .header__burger:hover,
.is-menu .header__burger:active{background:rgba(0,0,0,.04)}
.header__burger span{
  display:block;width:24px;height:1.75px;border-radius:2px;background:currentColor;
  transform-origin:center;
  transition:transform 260ms var(--ease), opacity 180ms var(--ease);
}
/* 3줄 총높이 17.25px → 바깥 두 줄의 중심 이동량 7.75px */
.is-menu .header__burger span:nth-child(1){transform:translateY(7.75px) rotate(45deg)}
.is-menu .header__burger span:nth-child(2){opacity:0}
.is-menu .header__burger span:nth-child(3){transform:translateY(-7.75px) rotate(-45deg)}

/* 모바일 드로어 */
.drawer{
  position:fixed;inset:0;z-index:190;
  background:#fff;
  padding:calc(var(--header-h) + 24px) var(--gutter) calc(env(safe-area-inset-bottom) + 32px);
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transform:translateY(-14px);
  transition:opacity 340ms var(--ease), transform 380ms var(--ease), visibility 380ms;
}
.is-menu .drawer{opacity:1;visibility:visible;transform:none}
.drawer__nav{display:flex;flex-direction:column;gap:4px}
.drawer__nav a{
  font-size:clamp(24px,7vw,30px);
  font-weight:700;
  letter-spacing:-.035em;
  color:var(--ink);
  padding:12px 0;
  opacity:0;transform:translateY(20px);
}
/* 배경 → 내비게이션 타이포 → 보조 액션 순으로 아주 짧은 stagger */
.is-menu .drawer__nav a{opacity:1;transform:none;transition:opacity var(--t-normal) var(--ease),transform var(--t-normal) var(--ease)}
.is-menu .drawer__nav a:nth-child(1){transition-delay:.10s}
.is-menu .drawer__nav a:nth-child(2){transition-delay:.15s}
.is-menu .drawer__nav a:nth-child(3){transition-delay:.20s}
.is-menu .drawer__nav a:nth-child(4){transition-delay:.25s}
.drawer__foot{margin-top:auto;padding-top:32px;border-top:1px solid var(--line)}
.js .drawer__foot{opacity:0;transform:translateY(16px)}
.js .is-menu .drawer__foot{
  opacity:1;transform:none;
  transition:opacity var(--t-normal) var(--ease) .30s, transform var(--t-normal) var(--ease) .30s;
}
.drawer__login{display:block;min-height:44px;line-height:44px;font-size:var(--font-nav-2);font-weight:500;color:var(--ink)}
.drawer__cta{
  display:flex;align-items:center;justify-content:center;
  height:54px;margin-top:12px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:var(--font-btn);font-weight:600;
  transition:transform var(--t-micro) var(--ease),background-color var(--t-ui) var(--ease);
}
.drawer__cta:active{transform:scale(.98)}

@media (max-width:991px){
  /* 좁아지면 메뉴를 억지로 줄이지 않고 햄버거로 전환합니다.
     ⚠️ 프로필은 남깁니다 — 우측은 「프로필 + 햄버거」 두 개.
        테마 · 언어 선택은 메뉴 안 「화면 설정」(.drawer__prefs)에서 제공합니다.
        → assets/sp-nav.css */
  .header__nav,.header__actions .header__lang,.header__actions .btn-download{display:none}
  .header__burger{display:flex}
  .header__actions{gap:2px}
  /* 프로필 · 햄버거 두 개만 남는 구간 — 히트 영역을 44px 로 맞춰 둡니다 */
  .header__icon{width:44px;height:44px}
}

/* ── 02b Mobile header refine ──────────────────────────────────────
   구조(로고 좌 / 햄버거 우 / Hero 위 transparent → 스크롤 후 white glass)는
   시안 그대로 두고 비율·정렬·전환만 다듬습니다.                        */
@media (max-width:767px){
  :root{--header-h:66px}
  /* 노치·다이내믹 아일랜드 — 헤더 높이에 safe area 를 더합니다 */
  .header{padding-top:env(safe-area-inset-top, 0px)}
  .header__inner{
    width:100%;
    padding-inline:var(--gutter);   /* 375~500 구간에서 20px — 본문 좌우 여백과 정확히 동일 */
    grid-template-columns:auto minmax(0,1fr);   /* 로고 좌 / 유틸리티 우 (메뉴는 드로어) */
    column-gap:12px;
  }
  .header__actions{grid-column:2}
  .header__logo{min-height:44px}
  .header__logo img{
    width:clamp(98px, 27vw, 108px);    /* 375 → 101px (보이는 폭 94px) · 430 → 108px (100px) */
    height:auto;
  }
  .header__icon{width:44px;height:44px}
  .header__icon svg{width:22px;height:22px}
  .header__icon .ic--globe{width:20px;height:20px}
  .header__icon .ic--person{width:26.5px;height:26.5px}
  /* Hero 위에서는 divider 없음 — 스크롤 후에만 아주 얇게 */
  .header.is-scrolled{
    background:rgba(255,255,255,.88);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }
  .header__burger{margin-right:-10px}
  .drawer{padding-top:calc(env(safe-area-inset-top, 0px) + var(--header-h) + 20px)}
  .drawer__nav{gap:8px}
  .drawer__nav a{font-size:clamp(26px, 7.2vw, 30px);font-weight:700;line-height:1.3;padding:9px 0}
  .drawer__cta{height:56px}
}
@media (max-width:359px){
  :root{--header-h:62px}
  .header__inner{padding-inline:18px}
  .header__logo img{width:94px}
  .drawer__nav a{font-size:23px}
}

@media (min-width:992px){
  .drawer{display:none}
}


/* ══ AUTH — SuperPlat Authentication System ════════════════════════
   ⚠️ 새 디자인 시스템 없음. 토큰·헤더·푸터·모션을 다른 페이지와 공유합니다.
      Toss 레퍼런스에서는 spacing / hierarchy / input polish 만 참고했고
      브랜드·컬러·컴포넌트는 SuperPlat 것을 씁니다.
   ═════════════════════════════════════════════════════════════════ */
:root{
  --auth-w:460px;              /* 로그인·찾기·재설정 */
  --auth-w-wide:640px;         /* 회원가입 (필드가 많은 화면) */
  --fld-h:56px;
  --fld-r:14px;
  --ok:#1F7A4D;
  --err:#C0392B;
  --err-bg:#FDECEC;
}
@media (max-width:1023px){ :root{--auth-w:100%;--auth-w-wide:100%} }
@media (max-width:767px){ :root{--fld-h:52px;--fld-r:12px} }   /* 모바일 control 높이 통일 */

/* 인증 페이지는 배너가 없으므로 헤더를 처음부터 밝은 상태로 */
.auth-page .header{background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.auth-page .header .header__logo img{filter:invert(1) brightness(.16)}
.auth-page .header .header__link,
.auth-page .header .header__icon,
.auth-page .header .header__burger{color:var(--ink)}
.auth-page .header .header__icon:hover{background:rgba(0,0,0,.05)}
.auth-page .header .btn-download{background:var(--ink);color:#fff}

.asec{
  /* fixed 헤더 아래로 실제 여백이 확보되도록 헤더 높이를 padding 에 포함합니다.
     로고를 없앤 만큼 위로 올리고, 남는 공간에서는 폼이 광학적 중앙에 오게 합니다. */
  padding-block:calc(var(--header-h) + clamp(32px,3.1vw,60px)) clamp(64px,5.6vw,110px);
  min-height:calc(100svh - var(--header-h));
  display:flex;flex-direction:column;justify-content:center;
}
@supports not (min-height:100svh){ .asec{min-height:calc(100vh - var(--header-h))} }
.acol{width:100%;max-width:var(--auth-w);margin-inline:auto}
.acol--wide{max-width:var(--auth-w-wide)}

/* ── A1 Head ───────────────────────────────────────────────────── */
.ahead{text-align:center}
.ahead--left{text-align:left}
.ahead__title{
  font-size:clamp(24px,1.9vw,34px);font-weight:700;line-height:1.35;letter-spacing:-.03em;color:var(--ink);
}
.ahead__desc{
  margin-top:clamp(10px,.83vw,16px);
  font-size:var(--font-body-md);line-height:1.65;letter-spacing:var(--ls-body);color:var(--body-2nd);
}
.ahead + .aform,.ahead + .aterms,.ahead + .adone{margin-top:clamp(28px,2.6vw,50px)}

/* ── A2 Field ──────────────────────────────────────────────────── */
.fld + .fld{margin-top:clamp(20px,1.7vw,28px)}
.fld__label{
  display:block;font-size:var(--font-body-sm);font-weight:600;letter-spacing:-.01em;color:var(--ink);
}
.fld__label .opt{margin-left:5px;font-weight:400;color:var(--body-2nd)}
.fld__label .req{margin-left:3px;color:var(--err)}
.fld__box{position:relative;margin-top:8px;display:flex;gap:8px}
.inp{
  flex:1;min-width:0;
  height:var(--fld-h);
  padding:0 16px;
  border:1px solid rgba(var(--ink-rgb),.14);
  border-radius:var(--fld-r);
  background:#fff;
  font-family:inherit;font-size:var(--font-body-md);color:var(--ink);
  transition:border-color 220ms var(--ease), background-color 220ms var(--ease);
}
.inp::placeholder{color:rgba(var(--ink-rgb),.36)}
@media (hover:hover){ .inp:hover:not(:disabled):not([aria-invalid="true"]){border-color:rgba(var(--ink-rgb),.30)} }
.inp:focus{outline:none;border-color:var(--ink);background:#fff}
.inp:disabled{background:#F4F5F6;color:var(--body-2nd);cursor:not-allowed}
.inp[aria-invalid="true"]{border-color:var(--err)}
.inp.is-ok{border-color:var(--ok)}
.inp--pw{padding-right:52px}
/* autofill 후에도 배경·글자색이 깨지지 않게 */
.inp:-webkit-autofill,.inp:-webkit-autofill:hover,.inp:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px #fff inset;
  transition:background-color 9999s ease-out;
}
.pwtog{
  position:absolute;right:0;top:0;height:100%;width:52px;
  display:grid;place-items:center;color:var(--body-2nd);
  transition:color 200ms var(--ease);
}
.pwtog svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){ .pwtog:hover{color:var(--ink)} }
.pwtog:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:10px}
.fld__msg{
  margin-top:7px;min-height:1.15em;
  font-size:var(--font-caption);line-height:1.5;color:var(--body-2nd);
  display:flex;align-items:flex-start;gap:5px;
}
.fld__msg svg{flex:none;width:14px;height:14px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fld__msg.is-err{color:var(--err)}
.fld__msg.is-ok{color:var(--ok)}
.fld__side{
  flex:none;height:var(--fld-h);padding:0 clamp(14px,1.05vw,20px);
  border-radius:var(--fld-r);
  border:1px solid rgba(var(--ink-rgb),.14);background:#fff;color:var(--ink);
  font-size:var(--font-body-sm);font-weight:600;white-space:nowrap;
  transition:background-color 200ms var(--ease), border-color 200ms var(--ease), opacity 200ms var(--ease), transform var(--t-fast) var(--ease);
}
@media (hover:hover){ .fld__side:hover:not([disabled]){background:#F7F8F9;border-color:rgba(var(--ink-rgb),.26)} }
.fld__side:active:not([disabled]){transform:scale(.98)}
.fld__side[disabled]{opacity:.42;cursor:not-allowed}
.fld__timer{
  position:absolute;right:110px;top:0;height:var(--fld-h);
  display:flex;align-items:center;
  font-size:var(--font-body-sm);color:var(--err);font-variant-numeric:tabular-nums;
  pointer-events:none;
}
@media (max-width:400px){ .fld__timer{right:96px} }

/* 성별 라디오 */
.radios{margin-top:10px;display:flex;flex-wrap:wrap;gap:clamp(14px,1.3vw,26px)}
.rad{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.rad input{position:absolute;opacity:0;width:1px;height:1px}
.rad__mark{
  width:20px;height:20px;border-radius:999px;border:1.5px solid rgba(var(--ink-rgb),.24);
  display:grid;place-items:center;
  transition:border-color 200ms var(--ease);
}
.rad__mark::after{content:'';width:10px;height:10px;border-radius:999px;background:var(--ink);transform:scale(0);transition:transform 200ms var(--ease)}
.rad input:checked + .rad__mark{border-color:var(--ink)}
.rad input:checked + .rad__mark::after{transform:scale(1)}
.rad input:focus-visible + .rad__mark{outline:2px solid var(--ink);outline-offset:3px}
.rad span:last-child{font-size:var(--font-body-md);color:var(--ink)}

/* 체크박스 */
.chk{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk__mark{
  flex:none;width:22px;height:22px;border-radius:7px;
  border:1.5px solid rgba(var(--ink-rgb),.22);background:#fff;
  display:grid;place-items:center;color:#fff;
  transition:background-color 200ms var(--ease), border-color 200ms var(--ease);
}
.chk__mark svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.7);transition:opacity 180ms var(--ease), transform 180ms var(--ease)}
.chk input:checked + .chk__mark{background:var(--ink);border-color:var(--ink)}
.chk input:checked + .chk__mark svg{opacity:1;transform:none}
.chk input:disabled + .chk__mark{background:#EDEEEF;border-color:rgba(var(--ink-rgb),.12)}
.chk input:focus-visible + .chk__mark{outline:2px solid var(--ink);outline-offset:3px}
.chk__txt{font-size:var(--font-body-sm);color:var(--ink);letter-spacing:-.01em}
.chk__txt .tag{color:var(--body-2nd);margin-right:4px}

/* ── A3 Button ─────────────────────────────────────────────────── */
.abtn{
  position:relative;
  width:100%;height:var(--fld-h);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--fld-r);
  background:var(--ink);color:#fff;
  font-size:var(--font-btn);font-weight:600;letter-spacing:-.01em;
  transition:background-color 220ms var(--ease), transform 200ms var(--ease), opacity 220ms var(--ease);
}
@media (hover:hover){ .abtn:hover:not([disabled]){background:#333B45} }
.abtn:active:not([disabled]){transform:scale(.985)}
.abtn[disabled]{opacity:.34;cursor:not-allowed}
.abtn--ghost{background:#fff;color:var(--ink);border:1px solid rgba(var(--ink-rgb),.16)}
@media (hover:hover){ .abtn--ghost:hover:not([disabled]){background:#F7F8F9} }
.abtn--auto{width:auto;padding:0 clamp(22px,1.9vw,36px)}
.spin{
  width:17px;height:17px;border-radius:999px;
  border:2px solid rgba(255,255,255,.34);border-top-color:#fff;
  animation:aspin .7s linear infinite;
}
@keyframes aspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation-duration:1.6s} }
.aform__cta{margin-top:clamp(26px,2.2vw,36px)}
.arow{
  margin-top:clamp(14px,1.05vw,18px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.alink{
  min-height:44px;display:inline-flex;align-items:center;
  font-size:var(--font-body-sm);font-weight:500;color:var(--body);
  transition:color 200ms var(--ease);
}
@media (hover:hover){ .alink:hover{color:var(--ink)} }
.alink:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.afoot{
  margin-top:clamp(22px,1.9vw,32px);text-align:center;
  font-size:var(--font-body-sm);color:var(--body-2nd);
}
.afoot b{font-weight:600;color:var(--ink);margin-left:6px}
/* 문장 안 인라인 링크 — 줄 높이는 그대로 두고 히트 영역만 44px 로 넓힙니다
   (padding 과 같은 크기의 음수 margin 이라 레이아웃은 1px 도 움직이지 않습니다) */
.afoot .alink{min-height:0;padding-block:12px;margin-block:-12px}

/* 폼 전체 오류 (서버/인증 실패) */
.abanner{
  margin-bottom:clamp(16px,1.3vw,22px);
  display:flex;align-items:flex-start;gap:8px;
  padding:13px 15px;border-radius:12px;
  background:var(--err-bg);color:var(--err);
  font-size:var(--font-body-sm);line-height:1.55;
}
.abanner svg{flex:none;width:16px;height:16px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.abanner[hidden]{display:none}

/* ── A4 비밀번호 규칙 ──────────────────────────────────────────── */
.pwrules{margin-top:12px;display:grid;gap:6px}
.pwrule{display:flex;align-items:center;gap:7px;font-size:var(--font-caption);color:var(--body-2nd);transition:color 200ms var(--ease)}
.pwrule svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pwrule.is-ok{color:var(--ok)}

/* ── A5 Progress ───────────────────────────────────────────────── */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:clamp(22px,2vw,34px);justify-content:center}
.steps__i{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:999px;
  background:#EDEEEF;color:var(--body-2nd);
  font-size:var(--font-caption);font-weight:700;
  transition:background-color 300ms var(--ease), color 300ms var(--ease);
}
.steps__i.is-on{background:var(--ink);color:#fff}
.steps__i.is-done{background:rgba(var(--ink-rgb),.14);color:var(--ink)}
.steps__bar{width:clamp(24px,3vw,48px);height:2px;background:#EDEEEF;border-radius:2px}
.steps__bar.is-on{background:rgba(var(--ink-rgb),.3)}

/* ── A6 약관 ───────────────────────────────────────────────────── */
.aterms__all{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:clamp(14px,1.1vw,18px);
  border-bottom:1px solid rgba(var(--ink-rgb),.12);
}
.aterms__all .chk__txt{font-size:var(--font-body-md);font-weight:700}
.aterms__list{margin-top:clamp(10px,.83vw,14px);display:grid}
.aterm{display:flex;align-items:center;justify-content:space-between;gap:10px}
.aterm__more{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  color:var(--body-2nd);border-radius:10px;
  transition:background-color 200ms var(--ease), color 200ms var(--ease);
}
.aterm__more svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){ .aterm__more:hover{background:rgba(var(--ink-rgb),.05);color:var(--ink)} }
.aterm__more:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* 약관 상세 */
.sheet{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:clamp(16px,3vw,48px)}
.sheet[hidden]{display:none}
.sheet__dim{position:absolute;inset:0;background:rgba(12,14,18,.42);opacity:0;transition:opacity 260ms var(--ease)}
.sheet.is-open .sheet__dim{opacity:1}
.sheet__more{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:18px;padding:11px 16px;border-radius:10px;
  border:1px solid rgba(var(--ink-rgb),.16);
  font-size:14px;font-weight:600;color:var(--ink);
  transition:background-color var(--t-micro) var(--ease);
}
@media (hover:hover){ .sheet__more:hover{background:rgba(var(--ink-rgb),.05)} }
.sheet__box{
  position:relative;z-index:1;
  width:100%;max-width:680px;max-height:min(78vh, 760px);
  display:flex;flex-direction:column;
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 24px 70px rgba(var(--ink-rgb),.18);
  opacity:0;transform:translateY(12px) scale(.99);
  transition:opacity 300ms var(--ease), transform 300ms var(--ease);
}
.sheet.is-open .sheet__box{opacity:1;transform:none}
@media (max-width:767px){
  .sheet{padding:0}
  .sheet__box{max-width:100%;max-height:100%;height:100%;border-radius:0}
}
.sheet__head{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:clamp(14px,1.1vw,20px) clamp(14px,1.3vw,24px);
  border-bottom:1px solid rgba(var(--ink-rgb),.08);
}
.sheet__back{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
.sheet__back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){ .sheet__back:hover{background:rgba(var(--ink-rgb),.05)} }
.sheet__t{font-size:var(--font-body-md);font-weight:700;color:var(--ink)}
.sheet__body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:clamp(20px,1.9vw,34px) clamp(16px,1.6vw,30px)}
.sheet__body h4{font-size:var(--font-heading-3);font-weight:700;line-height:1.4;color:var(--ink)}
.sheet__body .eff{margin-top:8px;font-size:var(--font-caption);color:var(--body-2nd)}
.sheet__body h5{margin-top:clamp(18px,1.5vw,26px);font-size:var(--font-body-md);font-weight:700;color:var(--ink)}
.sheet__body p{margin-top:8px;font-size:var(--font-body-sm);line-height:1.8;color:var(--body)}
.sheet__foot{flex:none;padding:clamp(12px,1.1vw,18px) clamp(14px,1.3vw,24px);border-top:1px solid rgba(var(--ink-rgb),.08)}

/* ── A7 완료 화면 ──────────────────────────────────────────────── */
.adone{text-align:center}
.adone__mark{
  width:64px;height:64px;margin:0 auto;border-radius:999px;
  background:var(--ink);color:#fff;display:grid;place-items:center;
}
.adone__mark svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.js .adone__mark{opacity:0;transform:scale(.8)}
.js .adone.is-in .adone__mark{opacity:1;transform:none;transition:opacity 480ms var(--ease), transform 520ms var(--ease)}
.adone__title{margin-top:clamp(18px,1.6vw,28px);font-size:clamp(22px,1.75vw,30px);font-weight:700;line-height:1.4;letter-spacing:-.03em;color:var(--ink)}
.adone__desc{margin-top:clamp(10px,.83vw,16px);font-size:var(--font-body-md);line-height:1.7;color:var(--body)}
.adone__cta{margin-top:clamp(28px,2.4vw,40px);display:grid;gap:10px}
.js .adone__title,.js .adone__desc,.js .adone__cta{opacity:0;transform:translateY(12px)}
.js .adone.is-in .adone__title{opacity:1;transform:none;transition:opacity 620ms var(--ease) .12s, transform 620ms var(--ease) .12s}
.js .adone.is-in .adone__desc{opacity:1;transform:none;transition:opacity 620ms var(--ease) .2s, transform 620ms var(--ease) .2s}
.js .adone.is-in .adone__cta{opacity:1;transform:none;transition:opacity 620ms var(--ease) .3s, transform 620ms var(--ease) .3s}

/* ── A8 화면 전환 ──────────────────────────────────────────────── */
.aview{transition:opacity 360ms var(--ease), transform 360ms var(--ease)}
.aview.is-swap{opacity:0;transform:translateY(6px)}
.js .aview{opacity:0;transform:translateY(18px)}
.js .aview.is-shown{opacity:1;transform:none;transition:opacity 700ms var(--ease), transform 700ms var(--ease)}
@media (prefers-reduced-motion:reduce){
  .js .aview,.js .adone__title,.js .adone__desc,.js .adone__cta,.js .adone__mark{opacity:1;transform:none}
  .aview,.sheet__box,.sheet__dim{transition:none}
}

/* ── 08 Final CTA + Footer ─────────────────────────────────────── */
.cta{background:var(--band);padding-block:var(--space-section-md) var(--space-section-sm)}
.cta__inner{display:flex;align-items:center;justify-content:space-between;gap:32px}
.cta__title{
  font-size:var(--font-heading-2);
  line-height:1.25;
  letter-spacing:-.025em;
  font-weight:700;
  color:var(--ink);
}
.cta__btn{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:var(--space-content-md);   /* 제목 → 버튼 20 → 36px */
  height:clamp(48px,3.3vw,63px);
  padding:0 clamp(20px,1.5vw,28px);
  border-radius:999px;
  background:var(--ink);color:#fff;
  font-size:var(--font-btn);font-weight:600;letter-spacing:-.01em;
  transition:background-color var(--t-ui) var(--ease), transform var(--t-micro) var(--ease);
}
.cta__btn:hover{background:#333B45;transform:scale(1.015)}
.cta__btn:active{transform:scale(.98)}
.cta__btn svg{
  width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform var(--t-fast) var(--ease);
}
.cta__btn:hover svg{transform:translate(3px,-3px)}
/* ⚠️ 캐릭터 그룹은 절대 늘어나면 안 됩니다.
   width 만 반응형으로 주고 height:auto + aspect-ratio + object-fit:contain 으로 고정.
   화면이 좁아지면 이미지가 눌리는 게 아니라 구성 전체가 비례로 작아집니다. */
.cta__art{
  flex:none;
  width:clamp(200px, 19.5vw, 375px);
  max-width:100%;
  height:auto;
  aspect-ratio:375 / 269;
  object-fit:contain;
}
/* ── Final CTA · 모바일 ──────────────────────────────────────────
   시안 composition 그대로: 텍스트·버튼은 왼쪽 정렬, 캐릭터는 그 아래 오른쪽.
   [이전 섹션] → 104 → 제목 → 28 → 버튼 → 48 → 캐릭터 → 80 → Footer      */
@media (max-width:767px){
  .cta{padding-block:104px 80px}
  .cta__inner{display:block}
  .cta__title{
    /* 두 구절이 각각 한 줄로 떨어지도록 폭에 맞춰 유동 (@375 31px) */
    font-size:clamp(26px, 8.3vw, 34px);
    line-height:1.22;
    letter-spacing:-.03em;
  }
  .cta__btn{margin-top:28px;height:50px;padding:0 22px;font-size:16px}
  /* ⚠️ 캐릭터 3개는 하나의 PNG composition 입니다.
     width 만 주고 height:auto + aspect-ratio + object-fit:contain 이므로
     화면이 좁아져도 개별 캐릭터가 눌리거나 잘리지 않고 비례로만 작아집니다. */
  .cta__art{width:min(88vw, 100%);margin-left:auto;margin-top:48px}
}
@media (max-width:359px){
  .cta__art{width:min(92vw, 100%)}
}

.footer{background:var(--band);padding-block:clamp(32px,2.6vw,50px) clamp(36px,3vw,58px);border-top:1px solid rgba(var(--line-rgb),.06)}
.footer__inner{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:flex-start;justify-content:space-between}
.footer__logo{display:flex;align-items:center;min-height:44px}
.footer__logo img{height:22px;width:auto;filter:invert(1) brightness(.16)}
.footer__links{display:flex;flex-wrap:wrap;gap:10px 28px}
.footer__links a{font-size:var(--font-nav-2);font-weight:500;color:var(--ink-soft);min-height:44px;display:inline-flex;align-items:center;transition:opacity var(--t-micro) var(--ease)}
.footer__links a:hover{opacity:.6}
.footer__bottom{
  width:100%;margin-top:8px;
  display:flex;align-items:center;justify-content:space-between;gap:16px 24px;
}
.footer__meta{font-size:var(--font-caption);font-weight:400;line-height:1.8;color:var(--body-2nd)}
/* ── Footer SNS ────────────────────────────────────────────────────
   아이콘만(텍스트 없음) · 브랜드 컬러 없음 · 원형 배경/그림자 없음.
   히트 영역(44px)과 보이는 아이콘 크기(20~21px)를 분리합니다.
   Bootstrap Icons 는 fill 기반이라 각 로고의 "먹는 면적"이 달라서,
   박스 크기를 기계적으로 같게 두지 않고 optical 로 맞췄습니다.
     discord   가로로 넓은 실루엣  → 21px
     youtube   가로로 가장 넓음    → 20px
     instagram 정사각 외곽선       → 20px                              */
/* 히트 영역 40×44 · 아이콘 20~21px → 아이콘 사이의 "보이는" 간격이 정확히 20px.
   (44×44 로 두면 보이는 간격이 24px 이 되어 요청하신 16~20px 범위를 벗어납니다) */
.footer__sns{display:flex;align-items:center;justify-content:flex-end;flex:none;margin-right:-10px}
.footer__sns-a{
  width:40px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-soft);opacity:.65;
  transition:opacity 200ms cubic-bezier(.22,1,.36,1),
             transform 200ms cubic-bezier(.22,1,.36,1),
             color 200ms cubic-bezier(.22,1,.36,1);
}
.footer__sns-a .ic{fill:currentColor;stroke:none;display:block}
.footer__sns-a .ic--discord{width:21px;height:21px}
.footer__sns-a .ic--youtube{width:20px;height:20px}
.footer__sns-a .ic--instagram{width:20px;height:20px}
@media (hover:hover){
  .footer__sns-a:hover{opacity:1;color:var(--ink);transform:translateY(-2px)}
}
.footer__sns-a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){ .footer__sns-a{transition-duration:1ms} }
/* 모바일 — 억지로 오른쪽에 붙이지 않고 Copyright 아래로 자연스럽게 내려옵니다.
   좌우 여백 기준선을 맞추기 위해 44px 히트 영역만큼 바깥으로 상쇄합니다. */
@media (max-width:767px){
  .footer__bottom{flex-direction:column;align-items:flex-start;gap:10px}
  .footer__sns{justify-content:flex-start;margin-left:-10px;margin-right:0}
}

/* ══ 09 Reveal system ═══════════════════════════════════════════════
   딱 세 가지만 씁니다. 그 외 요소는 정지 상태를 유지합니다(§scroll rhythm).
     .r-line  헤드라인 — mask line reveal (가장 강한 연출)
     .reveal  본문·카드 — fade-up (절제)
     .rv-img  큰 비주얼 — 컨테이너 고정 + 내부만 scale (radius 유지)
   ═══════════════════════════════════════════════════════════════════ */

/* 09-1. 헤드라인 line reveal — 아래에서 마스크가 걷히듯.
   구조(줄바꿈)는 JS 없이도 유지되고, 움직임만 .js 로 게이트합니다. */
.r-line{display:block}
.r-line--inline{display:inline-block;vertical-align:top}
.r-line--inline + .r-line--inline{margin-left:.28em}
/* 모바일 시안은 두 구절이 각각 한 줄 — 줄바꿈 위치를 고정합니다 */
@media (max-width:767px){
  .r-line--inline{display:block}
  .r-line--inline + .r-line--inline{margin-left:0}
}
.js .r-line{
  overflow:hidden;
  padding-bottom:.12em;   /* 디센더가 잘리지 않게 자리를 벌리고 */
  margin-bottom:-.12em;   /* 같은 값의 음수 마진으로 레이아웃은 되돌립니다 */
}
.js .r-line > span{
  display:block;
  transform:translateY(110%);
  opacity:0;
  transition:transform var(--t-reveal) var(--ease), opacity var(--t-reveal) var(--ease);
}
.js .is-in .r-line > span{transform:none;opacity:1}
.js .is-in .r-line:nth-child(2) > span{transition-delay:calc(var(--stagger))}
.js .is-in .r-line:nth-child(3) > span{transition-delay:calc(var(--stagger) * 2)}

/* 09-2. 본문·카드 fade-up — 헤드라인보다 늦게, 더 얕게 */
.js .reveal{opacity:0;transform:translateY(var(--rv-y))}
.js .reveal.is-in{
  opacity:1;transform:none;
  transition:opacity var(--t-reveal) var(--ease), transform var(--t-reveal) var(--ease);
}
.js .reveal--2.is-in{transition-delay:calc(var(--stagger) * 1.2)}
.js .reveal--3.is-in{transition-delay:calc(var(--stagger) * 2.2)}

/* 헤드라인 두 줄이 다 올라온 뒤 본문 (약 200ms 시차) */
.js .section-head .section-desc{opacity:0;transform:translateY(16px)}
.js .section-head.is-in .section-desc{
  opacity:1;transform:none;
  transition:opacity var(--t-normal) var(--ease) calc(var(--stagger) * 2.6),
             transform var(--t-normal) var(--ease) calc(var(--stagger) * 2.6);
}

/* 09-3. 큰 비주얼 — 공간이 열리며 드러나는 느낌.
   ⚠️ radius 를 가진 래퍼는 고정하고 내부 이미지만 transform 합니다.
   ⚠️ transform 이 아니라 translate/scale 개별 속성을 씁니다 —
      hover 의 transform 과 겹쳐도 서로 지워지지 않습니다. */
.js .rv-img{opacity:0;translate:0 calc(var(--rv-y) * .6)}
.js .rv-img.is-in{
  opacity:1;translate:0 0;
  transition:opacity var(--t-cine) var(--ease-soft), translate var(--t-cine) var(--ease-soft);
}
/* CTA 캐릭터 그룹 — 하나의 구성이 조용히 등장 (bounce·개별 비행 금지) */
.js .cta__art{opacity:0;scale:.96;translate:0 12px}
.js .cta__art.is-in{
  opacity:1;scale:1;translate:0 0;
  transition:opacity 900ms var(--ease-soft) calc(var(--stagger) * 3.4),
             scale     900ms var(--ease-soft) calc(var(--stagger) * 3.4),
             translate 900ms var(--ease-soft) calc(var(--stagger) * 3.4);
}
/* CTA 버튼 — 헤드라인 다음에 fade-up */
.js .cta__text .cta__btn{opacity:0;translate:0 16px}
.js .cta__text.is-in .cta__btn{
  opacity:1;translate:0 0;
  transition:opacity var(--t-normal) var(--ease) calc(var(--stagger) * 2.4),
             translate var(--t-normal) var(--ease) calc(var(--stagger) * 2.4),
             background-color var(--t-ui) var(--ease),
             transform var(--t-fast) var(--ease);
}

/* 09-4. 캐릭터 rail — rail 전체가 먼저 들어오고, 앞쪽 카드만 아주 짧게 stagger.
   (entrance 는 translate, hover 는 transform 이라 서로 간섭하지 않습니다) */
.js .marquee__card{opacity:0;translate:0 32px}
.js .marquee.is-in .marquee__card{
  opacity:1;translate:0 0;
  transition:opacity var(--t-reveal) var(--ease), translate var(--t-reveal) var(--ease),
             transform 680ms var(--ease-soft);
  transition-delay:calc(var(--stagger) * 2.6 + var(--i, 0) * 60ms),
                   calc(var(--stagger) * 2.6 + var(--i, 0) * 60ms), 0s;
}

/* 히어로 인트로 */
.js .hero__title .line > span,
.js .hero__sub .line > span{transform:translateY(112%)}
.js .hero__cta{opacity:0;transform:translateY(22px)}
.js .hero__scrollcue{opacity:0;transform:translateX(-50%) translateY(22px)}
.js .header{opacity:0}
.is-ready .hero__title .line > span,
.is-ready .hero__sub .line > span{transform:none;transition:transform 900ms var(--ease-soft)}
.is-ready .hero__title .line:nth-child(1) > span{transition-delay:.26s}
.is-ready .hero__title .line:nth-child(2) > span{transition-delay:.34s}
.is-ready .hero__sub .line:nth-child(1) > span{transition-delay:.44s}
.is-ready .hero__sub .line:nth-child(2) > span{transition-delay:.50s}
.is-ready .hero__cta{opacity:1;transform:none;transition:opacity 820ms var(--ease),transform 820ms var(--ease);transition-delay:.60s}
.is-ready .hero__scrollcue{opacity:1;transform:translateX(-50%);transition:opacity 820ms var(--ease),transform 820ms var(--ease);transition-delay:.80s}
.is-ready .header{opacity:1;
  /* ⚠️ transform 을 함께 적어 두지 않으면 인트로 전환이 Smart Header 전환을 덮어씁니다 */
  transition:opacity 900ms var(--ease) .1s, transform 320ms var(--ease)}
.js .hero__media{transform:scale(1.035);filter:brightness(.72)}
.is-ready .hero__media{
  transform:translate3d(var(--px,0px),var(--py,0px),0) scale(1);
  filter:none;
  transition:transform 1400ms var(--ease-soft), filter 1100ms var(--ease-soft);
}
/* 인트로가 끝나면 parallax 가 즉각 반응하도록 transition 을 짧게 */
.hero__media.is-live{transition:transform 480ms var(--ease)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .js .reveal,.js .rv-img,.js .cta__art,
  .js .section-head .section-desc,.js .cta__text .cta__btn,.js .drawer__foot{
    opacity:1;transform:none;translate:none;scale:none;

  .js .r-line > span,.js .cine__copy .line > span{transform:none;opacity:1}
  .js .r-line,.js .cine__copy .line{overflow:visible}
  .cine__clip video,.cine__clip img{transform:none}
  .js .marquee__card{opacity:1;translate:none;transform:none}
  .marquee__card:hover,.marquee__card:hover img{transform:none}
  .js .hero__title .line > span,.js .hero__sub .line > span{transform:none}
  .js .hero__cta,.js .hero__scrollcue,.js .header{opacity:1;transform:none}
  .js .hero__scrollcue{transform:translateX(-50%)}
  .js .hero__media{transform:none;filter:none}
  .hero__scrollcue svg{animation:none}
  .cine__copy .line{opacity:1;transform:none;filter:none}
  .slide.is-active .slide__inner img{animation:none}
}

/* ══ MOBILE — Touch feedback ═══════════════════════════════════════
   Hover 가 없는 환경에서 hover 효과를 억지로 흉내 내지 않고,
   눌렀을 때만 아주 짧게 가라앉습니다 (§13: scale .985~.99 · 150~220ms).
   기존에 .97 / .98 로 세게 눌리던 요소도 여기서 한 단계 부드럽게 맞춥니다. */
@media (hover:none){
  .btn:active,.btn--light:active,.btn--ghost:active,.btn-download:active,
  .sbtn:active,.abtn:active,.mpbtn:active,.mpbtn-s:active,.cta__btn:active,
  .dl__btn:active,.dl__card:active,.drv__btn:active,.smore__btn:active,
  .spsel__btn:active,.stab:active,.faq__q:active,.wtab:active,
  .nrow__link:active,.ecard__link:active,.ntab:active,
  .marquee__card:active,.wcard:active,.card:active,
  .drawer__cta:active,.pwtog:active,.spsearch__clear:active{
    transform:scale(.99);
    transition:transform 180ms var(--ease);
  }
  /* 눌림이 끝나면 원래대로 — 되돌아오는 쪽이 조금 더 길게 */
  .btn,.sbtn,.abtn,.mpbtn,.mpbtn-s,.cta__btn,.dl__btn,.drv__btn,.smore__btn,
  .spsel__btn,.stab,.faq__q,.nrow__link,.ecard__link,.marquee__card,.wcard{
    transition-property:background-color,color,border-color,box-shadow,opacity,transform;
    transition-duration:200ms;
  }
}

/* ══ MOBILE — Form control 높이 통일 ═══════════════════════════════
   화면마다 50 / 54 / 56 으로 제각각이던 높이를 52px 하나로 맞춥니다.

    var s = el('span', 'steps__i' + (i === n ? ' is-on' : i < n ? ' is-done' : ''), String(i));
    s.setAttribute('aria-hidden', 'true');
    w.appendChild(s);
    if (i < total) w.appendChild(el('span', 'steps__bar' + (i < n ? ' is-on' : '')));
  }
  return w;
}

/* ── 검증 헬퍼 ─────────────────────────────────────────────────── */
var isEmail = function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); };
function pwRulesState(v) { return CONFIG.password.rules.map(function (r) { return { r:r, ok:r.test(v) }; }); }
function pwOk(v) { return pwRulesState(v).every(function (x) { return x.ok; }); }
function fmtPhone(v) {
  var d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length < 4) return d;
  if (d.length < 8) return d.slice(0, 3) + '-' + d.slice(3);
  return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
}
function fmtBirth(v) {
  var d = v.replace(/\D/g, '').slice(0, 8);
  if (d.length < 5) return d;
  if (d.length < 7) return d.slice(0, 4) + '.' + d.slice(4);
  return d.slice(0, 4) + '.' + d.slice(4, 6) + '.' + d.slice(6);
}
function birthValid(v) {
  var m = v.match(/^(\d{4})\.(\d{2})\.(\d{2})$/);
  if (!m) return false;
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return false;
  return dt <= new Date() && y >= 1900;
}

/* ── 서버 호출 지점 (프로토타입: 지연 + 더미 응답) ────────────────── */
/* ── 서버 연결 지점 ───────────────────────────────────────────────
   화면 코드는 전부 이 api() 만 호출합니다. 실제 Backend 가 준비되면
   assets/sp-auth.js 의 Adapter 만 fetch 로 바꾸면 되고, 이 아래 화면
   코드는 한 줄도 고칠 필요가 없습니다.                                */
function api(action, payload) {
  payload = payload || {};
  if (payload.__fail) return Promise.reject(new Error('network'));
  switch (action) {
    case 'login':      return SPAuth.login(payload.email, payload.pw);
    case 'signup':     return SPAuth.signup(payload);
    case 'checkEmail': return SPAuth.checkEmail(payload.email);
    case 'checkNick':  return SPAuth.checkNick(payload.nick);
    case 'sendCode':   return SPAuth.sendCode(payload.email).then(function (r) {
                         devCode = r.devCode || '';
                         /* ⚠️ PROTOTYPE ONLY — 실제 서비스 인증 구현이 아닙니다.
                            메일 서버가 없으므로 QA 가 가입 플로우를 끝까지 진행할 수
                            있도록 인증번호를 개발자 콘솔로만 내보냅니다.
                            화면(Production UI)에는 어떤 형태로도 노출하지 않습니다.
                            실제 서비스에서는 SPAuth.CONFIG.DEV_CODE_HINT = false 로 두고
                            메일 발송으로 교체하세요. */
                         if (devCode && window.console && console.info) {
                           console.info('[SUPERPLAT PROTOTYPE ONLY] 인증번호:', devCode);
                         }
                         return r;
                       });
    case 'verifyCode': return codeLeft <= 0
                         ? Promise.reject(new Error('expired'))
                         : SPAuth.verifyCode(payload.email, payload.code);
    case 'resetPw':    return SPAuth.resetPassword(payload.email, payload.pw);
    default:           return Promise.resolve({ ok:true });
  }
}

/* ── 인증번호 타이머 ───────────────────────────────────────────── */
function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function startCodeTimer(timerEl, onExpire) {
  clearInterval(timers.code);
  codeLeft = CONFIG.codeTtlSec;
  timerEl.textContent = mmss(codeLeft);
  timers.code = setInterval(function () {
    codeLeft--;
    timerEl.textContent = mmss(Math.max(0, codeLeft));
    if (codeLeft <= 0) { clearInterval(timers.code); onExpire(); }
  }, 1000);
}
function startResendCooldown(btn, base) {
  clearInterval(timers.resend);
  resendLeft = CONFIG.resendCooldownSec;
  btn.disabled = true; btn.textContent = base + ' ' + resendLeft;
  timers.resend = setInterval(function () {
    resendLeft--;
    if (resendLeft <= 0) { clearInterval(timers.resend); btn.disabled = false; btn.textContent = base; }
    else btn.textContent = base + ' ' + resendLeft;
  }, 1000);
}
function stopTimers() { clearInterval(timers.code); clearInterval(timers.resend); }

  setTimeout(function () { sheet.hidden = true; if (sheet.__last) sheet.__last.focus(); }, reduce ? 0 : 260);
}
$$('[data-close]', sheet).forEach(function (b) { b.addEventListener('click', closeSheet); });
addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

function ScreenSignupTerms() {
  var col = el('div', 'acol');
  col.appendChild(Steps(1, 3));
  col.appendChild(Head({ title:T('약관에 동의해주세요.', 'Please agree to the terms.'),
    desc:T('서비스 이용을 위해 아래 약관에 동의가 필요해요.', 'We need your agreement to continue.') }));
  var box = el('div', 'aterms');
  var allWrap = el('div', 'aterms__all');
  var allChk = Checkbox(T('전체 동의', 'Agree to all'), false, function (v) {
    TERMS.forEach(function (t) { S.signup.terms[t.id] = v; });
    paint();
  });
  allWrap.appendChild(allChk); box.appendChild(allWrap);

  var list = el('div', 'aterms__list');
  var itemChks = {};
  TERMS.forEach(function (t) {
    var row = el('div', 'aterm');
    var c = Checkbox(T(t.ko, t.en), S.signup.terms[t.id], function (v) { S.signup.terms[t.id] = v; paint(); },
      { tag:T(t.req ? '(필수)' : '(선택)', t.req ? '(required)' : '(optional)') });
    itemChks[t.id] = c.__input;
    var more = el('button', 'aterm__more'); more.type = 'button';
    more.setAttribute('aria-label', T(t.ko, t.en) + T(' 전문 보기', ' — read full text'));
    more.appendChild(icon('chev'));
    more.addEventListener('click', function () { openSheet(t); });
    row.appendChild(c); row.appendChild(more);
    list.appendChild(row);
  });
  box.appendChild(list);
  col.appendChild(box);

  var cta = el('div', 'aform__cta');
  var next = Button(T('다음', 'Next'), { onClick:function () { S.signup.step = 2; go('signup'); } });
  cta.appendChild(next); col.appendChild(cta);
  var foot = el('p', 'afoot');
  var bl = el('a', 'alink', T('로그인으로 돌아가기', 'Back to sign in')); bl.href = '#';
  bl.addEventListener('click', function (e) { e.preventDefault(); go('login'); });
  foot.appendChild(bl); col.appendChild(foot);

  function paint() {
    TERMS.forEach(function (t) { itemChks[t.id].checked = !!S.signup.terms[t.id]; });
    allChk.__input.checked = TERMS.every(function (t) { return S.signup.terms[t.id]; });
    next.disabled = !TERMS.filter(function (t) { return t.req; })
      .every(function (t) { return S.signup.terms[t.id]; });
  }
  paint();
  return col;
}

function ScreenSignupInfo() {
  var col = el('div', 'acol acol--wide');
  col.appendChild(Steps(2, 3));
  col.appendChild(Head({ title:T('회원가입', 'Create your account'),
    desc:T('슈퍼플랫에서 사용할 정보를 입력해주세요.', 'Tell us the details you will use on SuperPlat.') }));
  var form = el('form', 'aform'); form.noValidate = true;
  var banner = Banner(); form.appendChild(banner);
  var su = S.signup;

  var fName = Field({ id:'suName', label:T('이름', 'Name'), required:true, autocomplete:'name',
    ph:T('이름을 입력해주세요.', 'Enter your name'), value:su.name,
    onInput:function (v, w) { su.name = v; w.setMsg(''); sync(); },
    onBlur:function (v, w) { if (!v.trim()) w.setMsg(T('필수 항목입니다.', 'This field is required.'), 'err'); } });

  var fPhone = Field({ id:'suPhone', label:T('휴대폰 번호', 'Mobile number'), required:true,
    type:'tel', inputmode:'numeric', autocomplete:'tel', maxlength:13,
    ph:T('숫자만 입력해주세요.', 'Numbers only'), value:su.phone,
    hint:T('연락처 확인 용도로만 사용합니다.', 'Used only to reach you.'),
    onInput:function (v, w) { su.phone = fmtPhone(v); w.__input.value = su.phone; w.setMsg(T('연락처 확인 용도로만 사용합니다.', 'Used only to reach you.')); sync(); },
    onBlur:function (v, w) { if (v && v.replace(/\D/g, '').length < 10) w.setMsg(T('휴대폰 번호를 확인해주세요.', 'Check the mobile number.'), 'err'); } });

  var fBirth = Field({ id:'suBirth', label:T('생년월일', 'Date of birth'), required:true,
    inputmode:'numeric', autocomplete:'bday', maxlength:10, ph:'YYYY.MM.DD', value:su.birth,
    onInput:function (v, w) { su.birth = fmtBirth(v); w.__input.value = su.birth; w.setMsg(''); sync(); },
    onBlur:function (v, w) { if (v && !birthValid(v)) w.setMsg(T('생년월일을 확인해주세요.', 'Check the date of birth.'), 'err'); } });

  var gWrap = el('div', 'fld');
  var gLab = el('p', 'fld__label', T('성별', 'Gender'));
  gLab.appendChild(el('span', 'req', '*'));
  gWrap.appendChild(gLab);
  var radios = el('div', 'radios');
  radios.setAttribute('role', 'radiogroup');
  radios.setAttribute('aria-label', T('성별', 'Gender'));
  [{ v:'m', ko:'남자', en:'Male' }, { v:'f', ko:'여자', en:'Female' }, { v:'n', ko:'선택안함', en:'Prefer not to say' }].forEach(function (o) {
    var l = el('label', 'rad');
    var i = document.createElement('input'); i.type = 'radio'; i.name = 'suGender'; i.value = o.v;
    i.checked = su.gender === o.v;
    var m = el('span', 'rad__mark');
    l.appendChild(i); l.appendChild(m); l.appendChild(el('span', null, T(o.ko, o.en)));
    i.addEventListener('change', function () { su.gender = o.v; gMsg.textContent = ''; sync(); });
    radios.appendChild(l);
  });
  gWrap.appendChild(radios);
  var gMsg = el('p', 'fld__msg is-err'); gMsg.setAttribute('role', 'alert'); gWrap.appendChild(gMsg);

  var fCode = null, timerEl = null;
  var fEmail = Field({ id:'suEmail', label:T('이메일', 'Email'), required:true, type:'email',
    autocomplete:'email', inputmode:'email', ph:T('이메일 주소를 입력해주세요.', 'Enter your email'),
    value:su.email,
    side:{ text:T('인증 요청', 'Send code'), onClick:sendCode },
    onInput:function (v, w) {
      su.email = v;
      if (su.emailVerified) {           /* 인증 후 이메일을 바꾸면 인증 상태 초기화 */
        su.emailVerified = false; su.code = '';
        if (fCode) { stopTimers(); fCode.remove(); fCode = null; }
        w.__side.disabled = false; w.__side.textContent = T('인증 요청', 'Send code');
      }
      w.setMsg(''); sync();
    },
    onBlur:function (v, w) { if (v && !isEmail(v)) w.setMsg(T('이메일 형식을 확인해주세요.', 'Check the email format.'), 'err'); } });

  function sendCode(inp, sb) {
    if (!isEmail(su.email)) { fEmail.setMsg(T('이메일 형식을 확인해주세요.', 'Check the email format.'), 'err'); inp.focus(); return; }
    sb.disabled = true; sb.textContent = T('확인 중', 'Checking');
    api('checkEmail', { email:su.email.trim() }).then(function (r) {
      if (r.taken) {
        sb.disabled = false; sb.textContent = T('인증 요청', 'Send code');
        fEmail.setMsg('', null);
        fEmail.__msg.className = 'fld__msg is-err';
        fEmail.__msg.appendChild(icon('alert'));
        fEmail.__msg.appendChild(el('span', null, T('이미 가입된 이메일입니다.', 'This email is already registered.')));
        var lg = el('a', 'alink', T('로그인하기', 'Sign in')); lg.href = '#';
        lg.style.marginLeft = '6px'; lg.style.minHeight = '0'; lg.style.fontSize = 'inherit'; lg.style.textDecoration = 'underline';
        lg.addEventListener('click', function (e) { e.preventDefault(); go('login'); });
        fEmail.__msg.appendChild(lg);
        fEmail.__input.setAttribute('aria-invalid', 'true');
        return;
      }
      return api('sendCode', { email:su.email }).then(function () {
        sb.textContent = T('재전송', 'Resend');
        showCode();
        startResendCooldown(sb, T('재전송', 'Resend'));
        fEmail.setMsg(T('인증번호를 보냈어요. 메일함을 확인해주세요.', 'We sent a code. Check your inbox.'), 'ok');
      });
    }).catch(function () {
      sb.disabled = false; sb.textContent = T('인증 요청', 'Send code');
      banner.show(T('일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'Something went wrong. Please try again.'));
    });
  }
  function showCode() {
    if (fCode) fCode.remove();
    fCode = Field({ id:'suCode', label:T('이메일 인증번호', 'Verification code'), required:true,
      inputmode:'numeric', maxlength:CONFIG.codeLength, autocomplete:'one-time-code',
      ph:T(CONFIG.codeLength + '자리 인증번호', CONFIG.codeLength + '-digit code'),
      side:{ text:T('확인', 'Verify'), onClick:verify },
      onInput:function (v, w) { su.code = v.replace(/\D/g, ''); w.__input.value = su.code; } });
    timerEl = el('span', 'fld__timer'); fCode.__box.appendChild(timerEl);
    fEmail.after(fCode);
    startCodeTimer(timerEl, function () {
      fCode.setMsg(T('인증 시간이 만료되었습니다. 새 인증번호를 요청해주세요.', 'The code expired. Please request a new one.'), 'err');
    });
    fCode.__input.focus();
  }
  function verify(inp, sb) {
    if (su.code.length !== CONFIG.codeLength) { fCode.setMsg(T('인증번호를 정확히 입력해주세요.', 'Enter the code.'), 'err'); return; }
    sb.disabled = true; sb.textContent = T('확인 중', 'Verifying');
    api('verifyCode', { email:su.email, code:su.code }).then(function () {
      stopTimers(); timerEl.textContent = '';
      su.emailVerified = true;
      fCode.setMsg(T('이메일 인증이 완료되었습니다.', 'Email verified.'), 'ok');
      inp.disabled = true; sb.textContent = T('완료', 'Done');
      fEmail.__side.disabled = true;
      sync();
    }).catch(function (err) {
      sb.disabled = false; sb.textContent = T('확인', 'Verify');
      fCode.setMsg(err.message === 'expired'
        ? T('인증 시간이 만료되었습니다. 새 인증번호를 요청해주세요.', 'The code expired. Please request a new one.')
        : T('인증번호가 일치하지 않습니다.', 'The code does not match.'), 'err');
    });
  }

  var rules = el('div', 'pwrules');
  var ruleEls = CONFIG.password.rules.map(function (r) {
    var p = el('p', 'pwrule'); p.appendChild(icon('check')); p.appendChild(el('span', null, T(r.ko, r.en)));
    rules.appendChild(p); return p;
  });
  var fPw2;
  var fPw = Field({ id:'suPw', label:T('비밀번호', 'Password'), required:true, password:true,
    autocomplete:'new-password', ph:T('비밀번호를 입력해주세요.', 'Enter a password'),
    onInput:function (v, w) {
      su.pw = v; w.setMsg('');
      pwRulesState(v).forEach(function (x, i) { ruleEls[i].classList.toggle('is-ok', x.ok); });
      if (fPw2 && fPw2.__input.value) matchPw();
      sync();
    } });
  fPw.appendChild(rules);
  fPw2 = Field({ id:'suPw2', label:T('비밀번호 확인', 'Confirm password'), required:true, password:true,
    autocomplete:'new-password', ph:T('비밀번호를 다시 입력해주세요.', 'Re-enter your password'),
    onInput:function (v) { su.pw2 = v; matchPw(); sync(); } });
  function matchPw() {
    if (!su.pw2) { fPw2.setMsg(''); return; }
    if (su.pw === su.pw2) fPw2.setMsg(T('비밀번호가 일치합니다.', 'Passwords match.'), 'ok');
    else fPw2.setMsg(T('비밀번호가 일치하지 않습니다.', 'Passwords do not match.'), 'err');
  }

  var nickT;
  var fNick = Field({ id:'suNick', label:T('닉네임', 'Nickname'), required:true,
    autocomplete:'nickname', maxlength:CONFIG.nickname.max,
    ph:T('사용할 닉네임을 입력해주세요.', 'Choose a nickname'), value:su.nick,
    onInput:function (v, w) {
      su.nick = v; su.nickState = ''; sync();
      clearTimeout(nickT);
      if (!v.trim()) { w.setMsg(''); return; }
      if (v.trim().length < CONFIG.nickname.min) {
        w.setMsg(T(CONFIG.nickname.min + '자 이상 입력해주세요.', 'At least ' + CONFIG.nickname.min + ' characters.'), 'err'); return;
      }
      su.nickState = 'checking';
      w.setMsg(T('확인 중이에요…', 'Checking…'));
      nickT = setTimeout(function () {
        api('checkNick', { nick:v.trim() }).then(function (r) {
          su.nickState = r.taken ? 'taken' : 'ok';
          w.setMsg(r.taken ? T('이미 사용 중인 닉네임입니다.', 'That nickname is taken.')
                           : T('사용할 수 있는 닉네임입니다.', 'That nickname is available.'),
                   r.taken ? 'err' : 'ok');
          sync();
        }).catch(function () { su.nickState = ''; w.setMsg(''); sync(); });
      }, 420);
    } });

  [fName, fPhone, fBirth, gWrap, fEmail, fPw, fPw2, fNick].forEach(function (f) { form.appendChild(f); });

  var cta = el('div', 'aform__cta');
  var submit = Button(T('가입하기', 'Create account'), { submit:true, disabled:true });
  cta.appendChild(submit); form.appendChild(cta);
  var backWrap = el('p', 'afoot');
  var back = el('a', 'alink', T('이전 단계로', 'Back')); back.href = '#';
  back.addEventListener('click', function (e) { e.preventDefault(); stopTimers(); S.signup.step = 1; go('signup'); });
  backWrap.appendChild(back); form.appendChild(backWrap);

  function sync() {
    submit.disabled = !(su.name.trim() && su.phone.replace(/\D/g, '').length >= 10 && birthValid(su.birth)
      && su.gender && su.emailVerified && pwOk(su.pw) && su.pw === su.pw2 && su.nickState === 'ok');
  }
  sync();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    banner.hide();
    var first = null;
    function bad(f, msg) { f.setMsg ? f.setMsg(msg, 'err') : (gMsg.textContent = msg); if (!first) first = f; }
    if (!su.name.trim()) bad(fName, T('필수 항목입니다.', 'This field is required.'));
    if (su.phone.replace(/\D/g, '').length < 10) bad(fPhone, T('휴대폰 번호를 확인해주세요.', 'Check the mobile number.'));
    if (!birthValid(su.birth)) bad(fBirth, T('생년월일을 확인해주세요.', 'Check the date of birth.'));
    if (!su.gender) bad(gWrap, T('성별을 선택해주세요.', 'Please select an option.'));
    if (!su.emailVerified) bad(fEmail, T('이메일 인증을 완료해주세요.', 'Please verify your email.'));
    if (!pwOk(su.pw)) bad(fPw, T('비밀번호 조건을 확인해주세요.', 'Check the password requirements.'));
    if (su.pw !== su.pw2) bad(fPw2, T('비밀번호가 일치하지 않습니다.', 'Passwords do not match.'));
    if (su.nickState !== 'ok') bad(fNick, T('닉네임을 확인해주세요.', 'Check your nickname.'));
    if (first) { (first.__input || first).focus && (first.__input || first).focus(); return; }

    submit.setLoading(true, T('가입 중', 'Creating'));
    /* 입력값을 그대로 계정으로 저장합니다 — 마이페이지가 이 데이터를 씁니다 */
    api('signup', {
      email: su.email.trim(), pw: su.pw,
      name: su.name.trim(), phone: su.phone, birth: su.birth, gender: su.gender,
      nick: su.nick.trim(), marketing: !!su.terms.marketing
    }).then(function () {
      submit.setLoading(false);
      /* 가입 완료 화면에서 바로 로그인해볼 수 있게 이메일을 넘겨둡니다 */
      S.login.email = su.email.trim(); S.login.pw = '';
      S.signup.step = 3; go('signup');
    }).catch(function (err) {
      submit.setLoading(false);
      banner.show(err.message === 'emailTaken'
        ? T('이미 가입된 이메일입니다.', 'That email is already registered.')
        : T('일시적인 오류가 발생했습니다. 입력하신 내용은 그대로 있으니 잠시 후 다시 시도해주세요.',
            'Something went wrong. Your entries are kept — please try again.'));
    });
  });
  col.appendChild(form);
  return col;
}

function ScreenSignupDone() {
  var col = el('div', 'acol');
  col.appendChild(Steps(3, 3));
  var d = el('div', 'adone');
  var m = el('div', 'adone__mark'); m.appendChild(icon('check')); d.appendChild(m);
  d.appendChild(el('p', 'adone__title', T('슈퍼플랫에 오신 것을 환영해요!', 'Welcome to SuperPlat!')));
  d.appendChild(el('p', 'adone__desc', T('회원가입이 완료되었습니다.\n방금 만든 계정으로 로그인해주세요.',
                                          'Your account is ready.\nSign in with the account you just created.')));
  var cta = el('div', 'adone__cta');
  cta.appendChild(Button(T('로그인하기', 'Sign in'), { onClick:function () {
    /* 방금 만든 계정으로 바로 로그인 테스트할 수 있게 회원가입 상태를 비웁니다 */
    S.signup = freshSignup();
    go('login');
  } }));
  d.appendChild(cta); col.appendChild(d);
  requestAnimationFrame(function () { d.classList.add('is-in'); });
  return col;
}

/* ── 라우팅 ────────────────────────────────────────────────────── */
var SCREENS = {
  login: ScreenLogin, loginDone: ScreenLoginDone,
  find: ScreenFind, reset: ScreenReset, resetDone: ScreenResetDone,
  signup: function () {
    return S.signup.step === 1 ? ScreenSignupTerms()
         : S.signup.step === 2 ? ScreenSignupInfo() : ScreenSignupDone();
  }
};
var TITLES = { login:'로그인', loginDone:'로그인', find:'비밀번호 찾기', reset:'비밀번호 재설정',
               resetDone:'비밀번호 재설정', signup:'회원가입' };
function paint() {
  view.textContent = '';
  view.appendChild(SCREENS[S.screen]());
  document.title = TITLES[S.screen] + ' — SuperPlat';
  view.classList.remove('is-shown');
  requestAnimationFrame(function () { view.classList.add('is-shown'); });
}
function go(name) {
  stopTimers();
  if (S.screen === name && name !== 'signup') return;
  S.screen = name;
  if (reduce) { paint(); return; }
  view.classList.add('is-swap');
  setTimeout(function () { paint(); view.classList.remove('is-swap'); }, 190);
}
window.__authRender = paint;
paint();
})();

</script>
