.mpsum{border-top:1px solid rgba(var(--ink-rgb),.10);margin-top:clamp(16px,1.5vw,24px);padding-top:clamp(14px,1.3vw,20px)}
.mpsum__r{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px}
.mpsum__r dt{font-size:var(--font-body-sm);color:var(--body-2nd)}
.mpsum__r dd{font-size:var(--font-body-sm);color:var(--body);font-variant-numeric:tabular-nums;text-align:right}
.mpsum__r--total{margin-top:6px;padding-top:14px;border-top:1px solid rgba(var(--ink-rgb),.14)}
.mpsum__r--total dt{font-size:var(--font-body-md);font-weight:700;color:var(--ink)}
.mpsum__r--total dd{font-size:clamp(20px,1.7vw,26px);font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.mpsum .tbd{color:var(--body-2nd);font-weight:500;font-size:var(--font-body-sm)}

/* 계좌 / 요약 박스 */
.mpbox{
  padding:clamp(16px,1.5vw,22px);border:1px solid rgba(var(--ink-rgb),.10);border-radius:16px;background:#FAFBFC;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.mpbox__t{flex:1;min-width:0}
.mpbox__k{font-size:var(--font-caption);color:var(--body-2nd)}
.mpbox__v{margin-top:3px;font-size:var(--font-body-md);font-weight:600;color:var(--ink)}
.mpbox__v span{color:var(--body-2nd);font-weight:500;font-variant-numeric:tabular-nums}

/* 수량 입력 + 전액 */
.mpqty{display:flex;gap:8px;align-items:flex-start}
.mpqty .fld{flex:1;min-width:0}
.mpqty .mpbtn-s{height:var(--fld-h);flex:none}

/* 확인 다이얼로그(공용) — 미저장 경고와 같은 컴포넌트를 씁니다 */
.mpdlg__box--wide{max-width:460px}
.mpdlg__list{margin-top:16px;display:grid;gap:0}
.mpdlg__list > div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid rgba(var(--ink-rgb),.08)}
.mpdlg__list dt{font-size:var(--font-body-sm);color:var(--body-2nd)}
.mpdlg__list dd{font-size:var(--font-body-sm);font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}

/* 완료 화면 */
.mpdone{padding:clamp(36px,4vw,64px) 20px;text-align:center}
.mpdone__mark{
  width:56px;height:56px;margin:0 auto;border-radius:999px;display:grid;place-items:center;
  background:#E7F4EC;color:#1F7A4D;
}
.mpdone__mark svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mpdone__t{margin-top:18px;font-size:var(--font-heading-3);font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.mpdone__d{margin-top:10px;font-size:var(--font-body-sm);line-height:1.75;color:var(--body-2nd);white-space:pre-line}
.mpdone__a{margin-top:26px;display:flex;justify-content:center}
.mpdone__a .abtn{width:auto;min-width:var(--btn-minw);height:var(--btn-h-lg);padding-inline:24px;border-radius:var(--btn-r)}
@media (max-width:767px){ .mpdone__a{display:grid} .mpdone__a .abtn{width:100%;min-width:0} }

/* ── 약관 내역 ──────────────────────────────────────────────────── */
.mpterms{border-top:1px solid rgba(var(--ink-rgb),.12)}
.mpterm{
  display:grid;grid-template-columns:minmax(0,1fr) 96px 128px 116px;
  align-items:center;gap:14px;
  padding-block:16px;border-bottom:1px solid rgba(var(--ink-rgb),.08);
}
.mpterm__n{font-size:var(--font-body-md);font-weight:600;color:var(--ink)}
.mpterm__v{margin-top:3px;font-size:var(--font-caption);color:var(--body-2nd)}
.mpterm__d{font-size:var(--font-body-sm);color:var(--body-2nd);font-variant-numeric:tabular-nums}
.mpterm__a{justify-self:end}
.mpterm__a .mpbtn-s{height:var(--btn-h-sm);padding-inline:14px}
@media (max-width:767px){
  .mpterm{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding-block:18px}
  .mpterm__n{grid-column:1}
  .mpterm__badge{grid-column:2;justify-self:end}
  .mpterm__d{grid-column:1 / -1}
  .mpterm__a{grid-column:1 / -1;justify-self:stretch}
  .mpterm__a .mpbtn-s{width:100%;height:44px}
}

/* 약관 전문 — 회원가입 시트와 같은 reading system 을 씁니다 */
.mplegal{max-width:730px}
.mplegal__t{margin-top:12px;font-size:var(--font-heading-3);font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.mplegal__m{margin-top:8px;font-size:var(--font-body-sm);color:var(--body-2nd)}
.mplegal__body{margin-top:clamp(22px,2.2vw,34px)}
.mplegal__body h5{margin-top:22px;font-size:var(--font-body-md);font-weight:700;color:var(--ink)}
.mplegal__body h5:first-child{margin-top:0}
.mplegal__body p{margin-top:8px;font-size:var(--font-body-sm);line-height:1.85;color:var(--body)}
.mplegal__more{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:22px;padding:11px 16px;border-radius:10px;
  border:1px solid rgba(var(--ink-rgb),.16);
  font-size:var(--font-body-sm);font-weight:600;color:var(--ink);
  transition:background-color var(--t-micro) var(--ease);
}
@media (hover:hover){ .mplegal__more:hover{background:rgba(var(--ink-rgb),.05)} }
/* 시행일 배지 — 같은 이유로 토큰을 씁니다(Dark 에서 밝은 판이 떠 보였습니다) */
.mplegal__body .eff{
  padding:12px 14px;border-radius:10px;background:var(--mpnote-bg);color:var(--mpnote-key);
  font-size:var(--font-caption);line-height:1.6;
}


/* 모바일 터치 타깃 — 모든 조작 요소를 44px 이상으로 */
@media (max-width:767px){
  .mpbtn-s{min-height:48px}
  .mpchip{min-height:44px;padding-inline:16px}
  .mpterm__a .mpbtn-s{height:48px}
  .mpav__acts .mpbtn-s{height:48px}
}


/* ══ CASH / BILLING — 공통 Form · Grid · Spacing System ══════════════
   개별 화면을 하나씩 손보지 않고, 아래 토큰과 클래스만 조합해서
   보유 재화 / 이용 내역 / 환불 / 정산 / 구독 / 결제 수단 화면이
   같은 그리드 위에 놓이도록 했습니다.

     콘텐츠 폭   .mpbody  max 960px      (목록 · 표 · 카드)
     폼 폭       .mpform  max 680px      (입력 화면)
     필드 높이   --fld-h 56px            (input · select 동일)
     라벨→필드   8px   필드→헬퍼 7px
     필드→필드   26px  그룹→그룹 44px
     섹션→섹션   56~88px (모바일 56~64)
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --mp-content:960px;
  --mp-form:760px;                       /* §02 readable width 720~840 */
  --mp-gap-field:26px;
  --mp-gap-group:44px;
}
@media (max-width:767px){ :root{ --mp-gap-field:24px; --mp-gap-group:36px; } }

/* 폼 컨테이너 — 4K 에서도 입력창이 늘어나지 않습니다 */
.mpform{width:100%;max-width:var(--mp-form)}
/* 같은 폼 안의 모든 필드는 하나의 세로 그리드 위에 */
.mpfields{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--mp-gap-field)}
.mpfields > .fld{margin:0}
.mpgroup + .mpgroup{margin-top:var(--mp-gap-group)}
/* 폼 안의 CTA 는 마지막 그룹과 같은 간격을 둡니다 */
.mpform > .mpacts,.mpform > .mpdl + .mpacts{margin-top:var(--mp-gap-group)}
.mpform > .mpnotice + .mpacts{margin-top:24px}
.mpgroup__h{font-size:var(--font-body-md);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.mpgroup__d{margin-top:6px;font-size:var(--font-caption);color:var(--body-2nd);line-height:1.6}
.mpgroup__b{margin-top:16px}

/* ── Select — .inp 과 완전히 동일한 규격 ─────────────────────────── */
.selct{
  flex:1;min-width:0;width:100%;
  height:var(--fld-h);
  padding:0 44px 0 16px;
  border:1px solid rgba(var(--ink-rgb),.14);
  border-radius:var(--fld-r);
  background:#fff;
  font-family:inherit;font-size:var(--font-body-md);font-weight:400;color:var(--ink);
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23171A21' stroke-width='1.6' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 16px center;background-size:20px;
  transition:border-color 220ms var(--ease);
}
@media (hover:hover){ .selct:hover{border-color:rgba(var(--ink-rgb),.30)} }
.selct:focus{outline:none;border-color:var(--ink)}
.selct:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(var(--ink-rgb),.10)}

/* ── Textarea — 높이만 다르고 나머지는 .inp 과 동일 ──────────────── */
.inp--area{
  height:auto;min-height:152px;padding:15px 16px;line-height:1.7;resize:vertical;
}
@media (max-width:767px){ .inp--area{min-height:132px} }

/* ── 숫자 + 단위 (Trailing element) ──────────────────────────────── */
.inp--unit{padding-right:82px}
.fld__unit{
  position:absolute;right:0;top:0;
  height:var(--fld-h);display:flex;align-items:center;padding-right:16px;
  font-size:var(--font-body-sm);font-weight:500;color:var(--body-2nd);
  pointer-events:none;
}
/* input 을 감싼 래퍼가 기준이라, 옆에 버튼이 붙어도 단위가 겹치지 않습니다 */
.inpwrap{position:relative;flex:1;min-width:0;display:flex}
.inpwrap .inp{flex:1;min-width:0}
.inpwrap .fld__unit{position:absolute;right:0;top:0;height:100%}

/* ── 섹션 리듬 ───────────────────────────────────────────────────
   구분선을 남발하지 않고 여백으로 나눕니다. (26번 항목)          */
.mpcard{padding-block:0}
/* Major Section Gap — 1920:120 · 1440:108 · 1280:104 · 1024:97.6 (요청 96~120) */
.mpcard + .mpcard{margin-top:clamp(96px, calc(72px + 2.5vw), 120px);border-top:0;padding-top:0}
.mpcard__h{
  font-size:var(--mp-sec);          /* §24 — 1920:22 · 375:19 (예전 27px 은 관리자 화면 스케일) */
  font-weight:700;letter-spacing:-.025em;line-height:1.35;color:var(--ink);
}
.mpcard__d{margin-top:10px;font-size:var(--mp-cap);color:var(--body-2nd);line-height:1.65;max-width:64ch}
/* Section Title(+설명) → Content — 1920:48 · 1440:44 · 1280:42.6 · 1024:40.5 */
.mpcard__body{margin-top:clamp(40px, calc(32px + .83vw), 48px)}

/* 안내 배너 → 첫 섹션 */
/* ⚠️ 예전에는 .mppane(가로 탭의 패널) 안에서만 아래 여백이 붙었습니다.
   탭을 없애면서 Notice 가 본문 직속이 되었으므로 두 경우 모두 잡아 줍니다. */
.mppane > .mpnotice,.mpbody > .mpnotice{margin-bottom:clamp(28px,2.6vw,40px)}
.mpform > .mpnotice{margin-bottom:0}

/* 페이지 제목 → 첫 섹션 */
.mp{margin-top:clamp(36px,3.4vw,56px)}
.mppane{margin-top:clamp(28px,2.6vw,40px)}

/* ── 카드 내부 패딩 통일 (Desktop 28~32 / Mobile 20~24) ─────────── */
.mpasset,.mpstat,.mpsub-card,.mpcard-pm,.mpplan{padding:clamp(20px, 2.1vw, 32px)}
.mpbox{padding:clamp(20px, 1.9vw, 28px)}
@media (max-width:767px){
  .mpasset,.mpstat,.mpsub-card,.mpcard-pm,.mpplan,.mpbox{padding:20px}
}

/* ── 보유 재화 — 하나의 left axis, 동일 높이 ─────────────────────── */
/* 재화 카드는 내용(정산 요청 버튼 유무)이 달라도 높이가 같아야 합니다 */
.mpassets{gap:clamp(12px,1.2vw,16px);align-items:stretch;grid-auto-rows:1fr}
.mpasset{height:100%}
.mpasset{gap:0;text-align:left}
.mpasset__top{margin-bottom:14px}
.mpasset__total{
  font-size:clamp(24px, calc(18px + .92vw), 34px);
  line-height:1.15;
}
.mpasset__sub{margin-top:16px;padding-top:14px}
.mpasset__cta{margin-top:16px}
.mpasset__why{margin-top:12px}

/* ── Summary — 3등분 · 동일 높이 · 숫자 baseline 정렬 ────────────── */
.mpstats{gap:clamp(12px,1.2vw,16px);align-items:stretch;grid-auto-rows:1fr}
.mpstat{height:100%}
.mpstat{display:flex;flex-direction:column;justify-content:flex-start}
.mpstat__k{min-height:1.5em}
.mpstat__v{
  margin-top:10px;
  font-size:clamp(20px, calc(15.6px + .61vw), 28px);
  line-height:1.25;min-height:1.25em;display:flex;align-items:flex-end;
}
.mpstat__v.is-pending{font-size:var(--font-body-md);line-height:1.25}

/* ── Key / Value — 오른쪽 끝선 정렬 ─────────────────────────────── */
.mpsum{margin-top:0;border-top:0;padding-top:0}
.mpsum__r{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:16px;padding-block:9px}
.mpsum__r dd{justify-self:end;text-align:right;white-space:nowrap}
.mpsum__r--total{margin-top:8px;padding-top:16px;border-top:1px solid rgba(var(--ink-rgb),.14)}
.mpdlg__list > div{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:16px}
.mpdlg__list dd{justify-self:end;text-align:right}

/* ── 구독 요약 · 결제 수단 ──────────────────────────────────────── */
.mpsub-card__grid{margin-top:clamp(20px,1.9vw,28px)}
.mpsub-card__acts{margin-top:clamp(20px,2vw,28px)}
.mpcards{gap:clamp(12px,1.1vw,16px)}

/* ── 탭 — 콘텐츠 좌측 기준선과 정확히 일치 ──────────────────────── */
.mptabs{padding-left:0;margin-left:0}
.mptab:first-child{padding-left:0}

/* ── 모바일 375 기준선 ──────────────────────────────────────────
   좌 20px / 우 355px. 카드·입력·버튼 모두 width 100%.            */
@media (max-width:767px){
  .mp{margin-top:clamp(32px,10vw,44px)}
  .mpcard + .mpcard{margin-top:clamp(64px, 20vw, 80px)}   /* 375:75 · 430:80 (요청 64~80) */
  .mppane{margin-top:24px}
  .mpcard__body{margin-top:clamp(28px, 8vw, 32px)}        /* 375:30 · 430:32 (요청 28~32) */
  .mpassets{grid-template-columns:minmax(0,1fr)}
  .mpstats{grid-template-columns:minmax(0,1fr)}
  .mpform,.mpfields > .fld,.selct,.inp,.mpbox,.mpasset,.mpstat,.mpsub-card,.mpcard-pm,.mpplan{width:100%}
  /* 데스크톱 2열 폼을 억지로 유지하지 않습니다 */
  .mpgrid{grid-template-columns:minmax(0,1fr);gap:var(--mp-gap-field)}
}

/* 좁은 화면에서 재화 요약이 2열로 눌리지 않도록 */
@media (min-width:480px) and (max-width:767px){
  .mpassets{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* ══ 회원 탈퇴 ═════════════════════════════════════════════════════
   화면 전체를 붉게 만들지 않고, 최종 CTA 와 차단 안내에만
   danger color 를 제한적으로 씁니다.                                */
.mpform--wide{max-width:800px}
.mpcard--danger{margin-top:clamp(64px,7vw,104px)}

/* 계정 요약 */
.wdwho{
  display:flex;align-items:center;gap:14px;
  padding:clamp(16px,1.5vw,20px);
  border:1px solid rgba(var(--ink-rgb),.10);border-radius:16px;background:#FAFBFC;
}
.wdwho__av{width:52px;height:52px;flex:none;border-radius:999px;object-fit:cover;background:#DCE3EE}
.wdwho__t{min-width:0}
.wdwho__n{font-size:var(--font-body-md);font-weight:700;color:var(--ink);letter-spacing:-.015em}
.wdwho__e{margin-top:2px;font-size:var(--font-body-sm);color:var(--body-2nd);word-break:break-all}
.wdwho + .mpgroup{margin-top:var(--mp-gap-group)}

/* 사전 점검 리스트 */
.wdlist{display:grid;gap:0;border-top:1px solid rgba(var(--ink-rgb),.10)}
.wdchk{padding-block:18px;border-bottom:1px solid rgba(var(--ink-rgb),.08)}
.wdchk__h{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:12px}
.wdchk__i{width:22px;height:22px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wdchk__i.is-ok{stroke:var(--ok)}
.wdchk__i.is-warn{stroke:#A65B00}
.wdchk__i.is-none{stroke:rgba(var(--ink-rgb),.30)}
.wdchk__n{font-size:var(--font-body-md);font-weight:600;color:var(--ink);letter-spacing:-.015em}
.wdchk__s{margin-top:2px;font-size:var(--font-caption);color:var(--body-2nd)}
.wdchk__h .mpbtn-s{height:var(--btn-h-sm);padding-inline:14px}
.wdchk__d{margin-top:12px;margin-left:34px;display:grid;gap:0;
  padding:12px 14px;border-radius:12px;background:#F7F8F9}
.wdchk__d > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding-block:5px}
.wdchk__d dt{font-size:var(--font-body-sm);color:var(--body-2nd)}
.wdchk__d dd{font-size:var(--font-body-sm);font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.wdchk__block{
  margin-top:10px;margin-left:34px;
  font-size:var(--font-caption);color:var(--err);line-height:1.6;
}
.wdchk__load{padding-block:24px;font-size:var(--font-body-sm);color:var(--body-2nd)}
.wdblock{
  margin-top:20px;padding:14px 16px;border-radius:12px;

}

}

.wdmore{

  border:0;background:none;padding:0;font:inherit;

}

.wdmore:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}

/* 필수 동의 — 항목마다 전체 문구를 읽을 수 있게 */
.wdagree{display:grid;gap:4px}
.wdagree__i{

}

/* Danger 버튼 — 같은 그룹 안에서 크기·radius·폰트는 동일 */
.mpbtn-s--solid{background:var(--err);border-color:var(--err);color:#fff}
@media (hover:hover){ .mpbtn-s--solid:hover:not([disabled]){background:#A93226;border-color:#A93226} }
.mpbtn-s--solid[disabled]{opacity:.4}
.abtn--danger{background:var(--err)}
@media (hover:hover){ .abtn--danger:hover:not([disabled]){background:#A93226} }

@media (prefers-reduced-motion:reduce){ .wdchk,.wdmore{transition:none} }


/* ══ BUTTON SIZE SYSTEM ════════════════════════════════════════════
   마이페이지의 모든 버튼은 아래 세 가지 크기만 씁니다.
   화면마다 임의의 width/height 를 쓰지 않고, 같은 그룹 안에서는
   height · radius · font-size · padding · min-width 가 동일합니다.

     Large  (Primary action)   52px · padding 28~32 · min-width 160
     Medium (General action)   48px · padding 20~24 · min-width 140
     Small  (Inline action)    40px · padding 16~20

   ⚠️ Full width 버튼은 쓰지 않습니다. 320px 처럼 아주 좁은 화면에서만
      fallback 으로 폭을 조정합니다.                                    */
:root{
  /* §08 — PC 44~48px · radius 8~10 · 「변경 내용 저장」 120~160px */
  --btn-h-lg:48px; --btn-h-md:44px; --btn-h-sm:40px;
  --btn-r:10px;    --btn-minw:140px; --btn-minw-md:124px; --btn-gap:12px;
  --btn-px-lg:26px; --btn-px-md:20px; --btn-px-sm:18px;
}

/* Large — Primary */
.mpacts .abtn,.mpacts .mpbtn-s,
.mpsave .abtn,.mpdone__a .abtn{
  width:auto;height:var(--btn-h-lg);
  min-width:var(--btn-minw);
  padding-inline:var(--btn-px-lg);
  border-radius:var(--btn-r);
  font-size:var(--font-btn);font-weight:600;
}
/* Medium */
.abtn--md,.mpsub-card__acts .mpbtn-s,.wdchk__h .mpbtn-s,.mpterm__a .mpbtn-s,
.mpplan__cta .mpbtn-s,.mpcard-pm__a .mpbtn-s,.mpasset__cta .mpbtn-s,.mpbox .mpbtn-s{
  height:var(--btn-h-md);min-width:var(--btn-minw-md);
  padding-inline:var(--btn-px-md);border-radius:var(--btn-r);
  font-size:var(--font-body-sm);font-weight:600;
}
/* Small — inline */
.mpbtn-s,.mpav__acts .mpbtn-s{
  height:var(--btn-h-sm);padding-inline:var(--btn-px-sm);
  border-radius:10px;font-size:14px;
}
.mpav__acts .mpbtn-s{min-width:0}
/* 인라인 보조 액션이 정보보다 강조되지 않게 */
.mpasset__cta .mpbtn-s,.mpcard-pm__a .mpbtn-s,.mpplan__cta .mpbtn-s{min-width:0}

/* 같은 그룹 안의 두 버튼은 크기가 정확히 같습니다 */
.mpacts{display:flex;gap:var(--btn-gap);justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mpacts > *{flex:none}

/* ── 프로필 저장 바 — 마지막 필드와 충분히 떨어뜨립니다 ────────── */
.mpsavebar{
  margin-top:clamp(32px,3vw,40px);
  padding-top:clamp(24px,2.4vw,32px);
  border-top:1px solid rgba(var(--ink-rgb),.10);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;
}
.mpsavebar__d{font-size:var(--font-caption);color:var(--body-2nd);line-height:1.6;flex:1;min-width:200px}
.mpsave{margin-top:0;justify-content:flex-end;flex:none}
.mpsave .abtn{width:auto;min-width:var(--btn-minw)}

/* 모바일에서도 Full width 로 만들지 않습니다 */
@media (max-width:767px){
  .mpsavebar{flex-direction:column;align-items:stretch;gap:14px}
  .mpsavebar__d{min-width:0}
  .mpsave{justify-content:flex-end}
  .mpsave .abtn,.mpsave .mpbtn-s{width:auto;min-width:var(--btn-minw);height:48px}
  .mpsave__msg{margin-right:auto;flex-basis:auto;order:0}
  .mpacts{justify-content:flex-end}
  .mpacts .abtn,.mpacts .mpbtn-s{width:auto;min-width:var(--btn-minw-md);height:48px}
  .mpacts--single{justify-content:flex-end}
  .mpdone__a{display:flex;justify-content:center}
  .mpdone__a .abtn{width:auto;min-width:var(--btn-minw)}
  /* 카드 안에서 2개가 나란히 놓이는 보조 액션은 칸을 나눠 씁니다 */
  .mpsub-card__acts .mpbtn-s,.mpcard-pm__a .mpbtn-s{min-width:0}
}
/* 아주 좁은 화면에서만 fallback */
@media (max-width:359px){
  .mpacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mpacts > *{width:100%}
  .mpacts .abtn,.mpacts .mpbtn-s{min-width:0;padding-inline:12px}
  .mpacts--single{grid-template-columns:1fr}
  .mpsave .abtn{min-width:0;width:100%}
}

/* ── 토스트 ──────────────────────────────────────────────────── */
.mptoast{
  position:fixed;left:50%;bottom:28px;z-index:200;
  transform:translate(-50%,12px);opacity:0;visibility:hidden;
  display:inline-flex;align-items:center;gap:8px;
  max-width:calc(100vw - 40px);
  padding:14px 20px;border-radius:999px;
  background:rgba(var(--ink-rgb),.94);color:#fff;
  font-size:var(--font-body-sm);font-weight:600;letter-spacing:-.01em;
  box-shadow:0 12px 32px rgba(0,0,0,.22);
  transition:opacity 240ms var(--ease), transform 240ms var(--ease), visibility 240ms;
}
.mptoast.is-on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.mptoast svg{width:17px;height:17px;stroke:#7BD6A4;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){ .mptoast{transition-duration:1ms} }
@media (max-width:767px){ .mptoast{bottom:20px;padding:13px 18px} }


/* ── 회원 탈퇴 안내 본문 ─────────────────────────────────────────
   작은 스크롤 박스에 압축하지 않고, 섹션별로 나눠 읽기 좋게 둡니다. */
.mpform--wide{max-width:760px}
.wdbox{
  padding:clamp(22px,2.2vw,32px);
  border-radius:16px;background:#F7F8F9;
}
.wdbox__s + .wdbox__s{margin-top:clamp(22px,2.1vw,30px)}
.wdbox__h{font-size:var(--font-body-md);font-weight:700;letter-spacing:-.015em;color:var(--ink);line-height:1.5}
.wdbox__p{margin-top:8px;font-size:var(--font-body-sm);line-height:1.8;color:var(--body);letter-spacing:-.005em}
@media (max-width:767px){ .wdbox{padding:20px} .wdbox__p{font-size:14px;line-height:1.75} }

.wdnote{margin-top:14px;display:grid;gap:6px;list-style:none;padding:0}
.wdnote li{
  position:relative;padding-left:14px;
  font-size:var(--font-caption);line-height:1.65;color:var(--body-2nd);
}
.wdnote li::before{content:'※';position:absolute;left:0;top:0;font-size:11px}

/* 동의는 안내 최하단 */
.wdagree{margin-top:clamp(24px,2.4vw,32px);display:grid;gap:2px}
.wdagree__i{align-items:flex-start;min-height:52px;padding:10px 0}

/* 탈퇴 사유 (선택) */
.mpgroup__opt{margin-left:6px;font-size:var(--font-caption);font-weight:500;color:var(--body-2nd)}
.wdreasons{
  display:grid;gap:2px;
  padding:clamp(10px,1vw,14px) clamp(14px,1.4vw,20px);

}
.wdreason{min-height:48px;gap:10px}
.wdreason__etc{margin-top:10px}
.wdreason__etc .inp--area{min-height:96px}

/* 잔여 재화 화면에서는 카드가 더 조용하게 */
.mpform--wide .mpassets{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:767px){ .mpform--wide .mpassets{grid-template-columns:minmax(0,1fr)} }
@media (min-width:480px) and (max-width:767px){ .mpform--wide .mpassets{grid-template-columns:repeat(2,minmax(0,1fr))} }


/* ══ MOBILE — Touch feedback ═══════════════════════════════════════
   Hover 가 없는 환경에서 hover 효과를 억지로 흉내 내지 않고,
   눌렀을 때만 아주 짧게 가라앉습니다 (§13: scale .985~.99 · 150~220ms).
   기존에 .97 / .98 로 세게 눌리던 요소도 여기서 한 단계 부드럽게 맞춥니다. */
@media (hover:none){
  .btn:active,.btn--light:active,.btn--ghost:active,.btn-download:active,
  .sbtn:active,.abtn:active,.mpbtn:active,.mpbtn-s:active,.cta__btn:active,
  .dl__btn:active,.dl__card:active,.drv__btn:active,.smore__btn:active,
  .spsel__btn:active,.stab:active,.faq__q:active,.wtab:active,
  .nrow__link:active,.ecard__link:active,.ntab:active,
  .marquee__card:active,.wcard:active,.card:active,
  .drawer__cta:active,.pwtog:active,.spsearch__clear:active{
    transform:scale(.99);
    transition:transform 180ms var(--ease);
  }
  /* 눌림이 끝나면 원래대로 — 되돌아오는 쪽이 조금 더 길게 */
  .btn,.sbtn,.abtn,.mpbtn,.mpbtn-s,.cta__btn,.dl__btn,.drv__btn,.smore__btn,
  .spsel__btn,.stab,.faq__q,.nrow__link,.ecard__link,.marquee__card,.wcard{
    transition-property:background-color,color,border-color,box-shadow,opacity,transform;
    transition-duration:200ms;
  }
}

/* ══ MOBILE — Form control 높이 통일 ═══════════════════════════════
   화면마다 50 / 54 / 56 으로 제각각이던 높이를 52px 하나로 맞춥니다.
   폭은 이미 전 페이지가 20px 그리드(320 @375)를 쓰고 있어 그대로 둡니다. */

}

/* ══ MOBILE — Page top breathing + Page Title scale ════════════════
   §04 페이지 상단 여백 72~96 · §05 Page Title 30~36.
   ⚠️ 헤더가 fixed 라 섹션 padding 만으로는 체감 여백이 생기지 않습니다.
      헤더 높이를 더한 뒤 실제로 보이는 여백을 기준으로 잡았습니다. */

}

@media (max-width:767px){

function fmtPhone(v) {
  var d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length < 4) return d;
  if (d.length < 8) return d.slice(0, 3) + '-' + d.slice(3);
  return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
}
function fmtBirth(v) {
  var d = v.replace(/\D/g, '').slice(0, 8);
  if (d.length < 5) return d;
  if (d.length < 7) return d.slice(0, 4) + '.' + d.slice(4);
  return d.slice(0, 4) + '.' + d.slice(4, 6) + '.' + d.slice(6);
}
function birthValid(v) {
  var m = v.match(/^(\d{4})\.(\d{2})\.(\d{2})$/);
  if (!m) return false;
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return false;
  return dt <= new Date() && y >= 1900;
}

/* 페이지 제목 / 설명 — 모든 화면이 같은 헤더 구조(제목 + 설명)를 씁니다 */
function menuItem(id) {
  for (var g = 0; g < MENU.length; g++)
    for (var i = 0; i < MENU[g].items.length; i++)
      if (MENU[g].items[i].id === id) return MENU[g].items[i];
  return null;
}
function genderLabel(v) {
  for (var i = 0; i < GENDERS.length; i++) if (GENDERS[i].v === v) return T(GENDERS[i].ko);
  return T('선택하지 않음');
}
function ic2(name) {
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = IC2[name];
  return s;
}

/* ── 현재 탭 (해시로 공유 가능) ─────────────────────────────────── */
function initialTab() {
  var h = (location.hash || '').replace('#', '');
  var parts = h.split('/');
  /* 예전 주소 호환 — #cash · #cash/sub 같은 링크가 살아 있어도 새 IA 로 연결됩니다 */
  if (parts[0] === 'cash') return menuItem(parts[1]) ? parts[1] : 'assets';
  if (menuItem(parts[0])) return parts[0];
  return 'profile';
}
var tab = initialTab();
var dirty = false;          /* 저장하지 않은 변경이 있는가 */

/* ── 미저장 경고 ────────────────────────────────────────────────── */
var dlgResolve = null;
function confirmLeave() {
  if (!dirty) return Promise.resolve(true);
  dlg.hidden = false;
  requestAnimationFrame(function () { dlg.classList.add('is-in'); });
  $('#mpDlgNo').focus();
  return new Promise(function (res) { dlgResolve = res; });
}
function closeDlg(v) {
  dlg.classList.remove('is-in');
  setTimeout(function () { dlg.hidden = true; }, reduce ? 0 : 200);
  if (dlgResolve) { dlgResolve(v); dlgResolve = null; }
}
$('#mpDlgNo').addEventListener('click', function () { closeDlg(false); });
$('#mpDlgYes').addEventListener('click', function () { closeDlg(true); });
dlg.querySelector('[data-close]').addEventListener('click', function () { closeDlg(false); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !dlg.hidden) closeDlg(false);
});
addEventListener('beforeunload', function (e) {
  if (!dirty) return;
  e.preventDefault(); e.returnValue = '';
});

/* ── 내비게이션 ─────────────────────────────────────────────────── */
function buildNav() {
  navEl.textContent = ''; selEl.textContent = '';
  navEl.setAttribute('aria-label', T('마이페이지 메뉴'));
  MENU.forEach(function (g) {
    var group = el('div', 'mpnav__group');
    group.appendChild(el('p', 'mpnav__cap', g.cap));
    var og = document.createElement('optgroup');
    og.label = g.cap;

    g.items.forEach(function (m) {
      var b = el('button', 'mpnav__btn' + (m.id === tab ? ' is-on' : ''));
      b.type = 'button';
      if (m.id === tab) b.setAttribute('aria-current', 'page');
      b.appendChild(ic2(m.icon));
      b.appendChild(el('span', null, m.label));
      b.addEventListener('click', function () { goTab(m.id); });
      group.appendChild(b);

      var o = document.createElement('option');
      o.value = m.id; o.textContent = m.label; o.selected = m.id === tab;
      og.appendChild(o);
    });
    navEl.appendChild(group);
    selEl.appendChild(og);
  });
  /* 모바일 select 는 공통 Dropdown System 이 커스텀 메뉴로 감싸고 있습니다.
     옵션을 새로 만들었으니 그 사본도 같이 다시 그립니다 (언어 전환 대응). */
  if (selEl.__sp && selEl.__sp.refresh) selEl.__sp.refresh();
}
selEl.addEventListener('change', function () { goTab(selEl.value); });

function goTab(id) {
  if (id === tab) return;
  confirmLeave().then(function (ok) {
    if (!ok) { selEl.value = tab; return; }
    dirty = false;
    tab = id;
    legalOpen = null; cashView = null; ledgerFilter = 'all'; wdReset();   /* 하위 화면 상태 초기화 */
    history.replaceState(null, '', '#' + id);
    buildNav();
    swap(render);
  });
}
/* 주소창의 해시가 바뀌면(뒤로가기 · 링크 · 직접 입력) 화면도 따라갑니다.
   ⚠️ 예전에는 이 처리가 없어서, 같은 문서 안에서 #sub → #pay 로 이동해도
      주소만 바뀌고 화면은 그대로였습니다(실측). */
var hashLock = false;
addEventListener('hashchange', function () {
  if (hashLock) { hashLock = false; return; }
  var next = initialTab();
  if (next === tab && !cashView && !wdStep) return;
  confirmLeave().then(function (ok) {
    if (!ok) { hashLock = true; location.hash = '#' + tab; return; }
    dirty = false;
    tab = next;
    legalOpen = null; cashView = null; ledgerFilter = 'all'; wdReset();
    buildNav();
    swap(render);
  });
});

function swap(fn) {
  if (reduce) { fn(); scrollTo({ top:0, behavior:'auto' }); return; }
  bodyEl.classList.add('is-swap');
  setTimeout(function () { fn(); bodyEl.classList.remove('is-swap'); }, 190);
}

/* ── 공용 조각 ──────────────────────────────────────────────────── */
function Card(title, desc, opts) {
  opts = opts || {};
  var s = el('section', 'mpcard');
  var h = el('h2', 'mpcard__h', title);
  s.appendChild(h);
  if (desc) s.appendChild(el('p', 'mpcard__d', desc));
  var b = el('div', 'mpcard__body'); s.appendChild(b);
  s.__body = b;
  return s;
}
function Empty(t, d) {
  var w = el('div', 'mpempty');
  w.appendChild(el('p', 'mpempty__t', t));
  w.appendChild(el('p', 'mpempty__d', d));
  return w;
}
function SaveRow(btn) {
  var row = el('div', 'mpsave');
  var msg = el('p', 'mpsave__msg');
  row.appendChild(msg); row.appendChild(btn);
  row.__msg = msg;
  row.setMsg = function (text, kind) {
    msg.textContent = '';
    msg.className = 'mpsave__msg' + (kind ? ' is-' + kind : '');
    if (text && kind) msg.appendChild(icon(kind === 'ok' ? 'check' : 'alert'));
    if (text) msg.appendChild(el('span', null, text));
  };
  return row;
}

/* ══ 1. 프로필 ═════════════════════════════════════════════════════ */
function ViewProfile() {
  var frag = document.createDocumentFragment();
  /* 편집 중인 값 — 저장 전까지 계정 데이터를 건드리지 않습니다 */
  var d = { name:me.name || '', nick:me.nick || '', phone:me.phone || '',
            birth:me.birth || '', gender:me.gender || '', avatar:me.avatar || '' };
  var nickState = 'ok';   /* '' | 'checking' | 'ok' | 'taken' */
  var nickTimer = null;

  /* ── 프로필 사진 ── */
  var cPhoto = Card(T('프로필 사진'), T('정사각형 이미지를 권장해요. PNG · JPG · WEBP, 최대 2MB.'));
  var av = el('div', 'mpav');
  var img = document.createElement('img');
  img.className = 'mpav__img'; img.alt = T('내 프로필 이미지');
  img.src = d.avatar || SPAuth.DEFAULT_AVATAR;
  var file = document.createElement('input');
  file.type = 'file'; file.accept = CONFIG.avatar.accept; file.hidden = true;
  var acts = el('div', 'mpav__acts');
  var bUp = el('button', 'mpbtn-s', T('사진 변경')); bUp.type = 'button';
  var bDel = el('button', 'mpbtn-s', T('기본 이미지로')); bDel.type = 'button';
  bDel.disabled = !d.avatar;
  var note = el('p', 'mpav__note', '');

  bUp.addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    if (!f) return;
    if (f.size > CONFIG.avatar.maxBytes) {
      note.textContent = T('2MB 이하 이미지를 올려주세요.'); note.style.color = 'var(--err)';
      file.value = ''; return;
    }
    var r = new FileReader();
    r.onload = function () {
      d.avatar = String(r.result);
      img.src = d.avatar; bDel.disabled = false;
      note.textContent = T('저장하기를 누르면 반영됩니다.'); note.style.color = '';
      markDirty();
    };
    r.readAsDataURL(f);
    file.value = '';
  });
  bDel.addEventListener('click', function () {
    d.avatar = ''; img.src = SPAuth.DEFAULT_AVATAR; bDel.disabled = true;
    note.textContent = T('저장하기를 누르면 반영됩니다.'); note.style.color = '';
    markDirty();
  });
  acts.appendChild(bUp); acts.appendChild(bDel);
  av.appendChild(img); av.appendChild(acts); av.appendChild(note); av.appendChild(file);
  cPhoto.__body.appendChild(av);
  frag.appendChild(cPhoto);

  /* ── 기본 정보 ── */
  var cInfo = Card(T('기본 정보'), T('계정 ID(이메일)는 로그인에 사용되며 변경할 수 없습니다.'));
  var grid = el('div', 'mpgrid');

  var fEmail = Field({ id:'mpEmail', label:T('계정 ID (이메일)'), value:me.email, readonly:true,
    hint:T('로그인 시 사용하는 아이디입니다.') });
  fEmail.classList.add('fld--full');

  var fName = Field({ id:'mpName', label:T('이름'), value:d.name, autocomplete:'name',
    ph:T('이름을 입력해주세요.'),
    onInput:function (v, w) { d.name = v; w.setMsg(''); markDirty(); },
    onBlur:function (v, w) { if (!v.trim()) w.setMsg(T('필수 항목입니다.'), 'err'); } });

  var fNick = Field({ id:'mpNick', label:T('닉네임'), value:d.nick, autocomplete:'nickname',
    maxlength:CONFIG.nickname.max, ph:CONFIG.nickname.min + '~' + CONFIG.nickname.max + T('자'),
    onInput:function (v, w) {
      d.nick = v; markDirty();
      nickState = 'checking'; w.setMsg('');
      clearTimeout(nickTimer);
      if (v.trim().length < CONFIG.nickname.min) {
        nickState = ''; w.setMsg(CONFIG.nickname.min + T('자 이상 입력해주세요.'), 'err'); return;
      }
      nickTimer = setTimeout(function () {
        SPAuth.checkNick(v.trim()).then(function (r) {
          if (d.nick !== v) return;
          nickState = r.taken ? 'taken' : 'ok';
          w.setMsg(r.taken ? T('이미 사용 중인 닉네임입니다.') : T('사용할 수 있는 닉네임입니다.'),
                   r.taken ? 'err' : 'ok');
        });
      }, 320);
    } });

  var fPhone = Field({ id:'mpPhone', label:T('휴대폰 번호'), inputmode:'numeric', autocomplete:'tel',
    maxlength:13, ph:'010-0000-0000', value:d.phone,
    onInput:function (v, w) { d.phone = fmtPhone(v); w.__input.value = d.phone; w.setMsg(''); markDirty(); },
    onBlur:function (v, w) {
      if (v && v.replace(/\D/g, '').length < 10) w.setMsg(T('휴대폰 번호를 확인해주세요.'), 'err');
    } });

  var fBirth = Field({ id:'mpBirth', label:T('생년월일'), inputmode:'numeric', autocomplete:'bday',
    maxlength:10, ph:'YYYY.MM.DD', value:d.birth,
    onInput:function (v, w) { d.birth = fmtBirth(v); w.__input.value = d.birth; w.setMsg(''); markDirty(); },
    onBlur:function (v, w) { if (v && !birthValid(v)) w.setMsg(T('생년월일을 확인해주세요.'), 'err'); } });

  var gWrap = el('div', 'fld');
  gWrap.appendChild(el('p', 'fld__label', T('성별')));
  var radios = el('div', 'radios');
  radios.setAttribute('role', 'radiogroup'); radios.setAttribute('aria-label', T('성별'));
  GENDERS.forEach(function (o) {
    var l = el('label', 'rad');
    var i = document.createElement('input');
    i.type = 'radio'; i.name = 'mpGender'; i.value = o.v; i.checked = d.gender === o.v;
    l.appendChild(i); l.appendChild(el('span', 'rad__mark')); l.appendChild(el('span', null, T(o.ko)));
    i.addEventListener('change', function () { d.gender = o.v; markDirty(); });
    radios.appendChild(l);
  });
  gWrap.appendChild(radios);

  [fEmail, fName, fNick, fPhone, fBirth, gWrap].forEach(function (f) { grid.appendChild(f); });
  cInfo.__body.appendChild(grid);

  frag.appendChild(cInfo);

  /* ⚠️ 저장 CTA 는 프로필 전체에서 딱 하나입니다.
     카드마다 반복하지 않고 페이지 최하단에 한 번만 둡니다. */
  var saveBtn = Button(T('변경 내용 저장'), { disabled:true, auto:true });
  var saveRow = SaveRow(saveBtn);

  function markDirty() { dirty = true; saveBtn.disabled = false; saveRow.setMsg(''); }

  saveBtn.addEventListener('click', function () {
    saveRow.setMsg('');
    var bad = null;
    if (!d.name.trim()) { fName.setMsg(T('필수 항목입니다.'), 'err'); bad = bad || fName; }
    if (d.nick.trim().length < CONFIG.nickname.min) { fNick.setMsg(T('닉네임을 확인해주세요.'), 'err'); bad = bad || fNick; }
    if (nickState === 'taken') { bad = bad || fNick; }
    if (d.phone && d.phone.replace(/\D/g, '').length < 10) { fPhone.setMsg(T('휴대폰 번호를 확인해주세요.'), 'err'); bad = bad || fPhone; }
    if (d.birth && !birthValid(d.birth)) { fBirth.setMsg(T('생년월일을 확인해주세요.'), 'err'); bad = bad || fBirth; }
    if (bad) { saveRow.setMsg(T('입력한 내용을 확인해주세요.'), 'err'); bad.__input && bad.__input.focus(); return; }

    saveBtn.setLoading(true, T('저장 중'));
    SPAuth.update({ name:d.name.trim(), nick:d.nick.trim(), phone:d.phone,
                    birth:d.birth, gender:d.gender, avatar:d.avatar })
      .then(function (r) {
        saveBtn.setLoading(false);
        me = r.user;                       /* 헤더는 SPAuth 이벤트로 이미 갱신됩니다 */
        dirty = false; saveBtn.disabled = true;   /* 변경사항이 없으니 다시 비활성 */
        saveRow.setMsg('');
        Toast(T('변경 내용이 저장되었습니다.'));
      })
      .catch(function () {
        saveBtn.setLoading(false);
        saveRow.setMsg(T('저장하지 못했어요. 잠시 후 다시 시도해주세요.'), 'err');
      });
  });

  /* ── 보안 : 비밀번호는 별도 인증이 필요하므로 하단 저장과 분리합니다 ── */
  /* ⚠️ 비밀번호 변경은 「계정 관리」로 옮겼습니다.
     프로필은 '내가 보여지는 정보', 계정 관리는 '로그인/보안'으로 나눕니다.
     덕분에 이 화면에는 저장 버튼이 정확히 하나만 남습니다. */

  /* ── 프로필 전체의 단 하나뿐인 Primary CTA ── */
  var footer = el('div', 'mpsavebar');
  footer.appendChild(el('p', 'mpsavebar__d',
    T('프로필 사진 · 이름 · 닉네임 · 휴대폰 · 생년월일 · 성별 변경 내용을 저장합니다.')));
  footer.appendChild(saveRow);
  frag.appendChild(footer);
  return frag;
}

    onInput:function (x, w) {
      v.next2 = x;
      w.setMsg(x && x !== v.next ? T('비밀번호가 일치하지 않습니다.') : '', x && x !== v.next ? 'err' : '');
      sync();
    } });

  var grid = el('div', 'mpgrid');
  fCur.classList.add('fld--full');
  grid.appendChild(fCur);
  var col = el('div', 'fld--full');
  col.appendChild(fNew); col.appendChild(rules);
  grid.appendChild(col);
  fNew2.classList.add('fld--full');
  grid.appendChild(fNew2);
  c.__body.appendChild(grid);

  /* Primary 는 하단 저장 CTA 하나뿐 — 여기는 Secondary 로 둡니다 */
  var btn = Button(T('비밀번호 변경'), { disabled:true, ghost:true, auto:true });
  btn.classList.add('abtn--md');
  var row = SaveRow(btn);
  c.__body.appendChild(row);

  function sync() { btn.disabled = !(v.cur && SPAuth.pwOk(v.next) && v.next === v.next2); }

  btn.addEventListener('click', function () {
    row.setMsg('');
    btn.setLoading(true, T('변경 중'));
    SPAuth.changePassword(v.cur, v.next)
      .then(function () {
        btn.setLoading(false);
        v = { cur:'', next:'', next2:'' };
        [fCur, fNew, fNew2].forEach(function (f) { f.__input.value = ''; f.setMsg(''); });
        paintRules(); sync();
        row.setMsg(T('비밀번호를 변경했어요. 다음 로그인부터 적용됩니다.'), 'ok');
      })
      .catch(function (err) {
        btn.setLoading(false);
        if (err.message === 'wrongPassword') {
          fCur.setMsg(T('현재 비밀번호가 일치하지 않습니다.'), 'err'); fCur.__input.focus();
          row.setMsg(T('현재 비밀번호를 확인해주세요.'), 'err');
        } else if (err.message === 'samePassword') {
          fNew.setMsg(T('기존과 다른 비밀번호를 사용해주세요.'), 'err'); fNew.__input.focus();
          row.setMsg(T('기존과 다른 비밀번호를 사용해주세요.'), 'err');
        } else {
          row.setMsg(T('변경하지 못했어요. 잠시 후 다시 시도해주세요.'), 'err');
        }
      });
  });
  return c;
}


/* ══════════════════════════════════════════════════════════════════
   회원 탈퇴

   ① 정보 다시 입력 / 본인 확인
   ② 회원 탈퇴 안내(약관) + 하단 필수 동의
   ③ 잔여 재화 확인 (+ 정산 · 구독 상태)
   ④ [탈퇴 취소] [회원 탈퇴]
   ⑤ 최종 확인 모달
   ⑥ 탈퇴 완료

   ⚠️ ⑤에서 [회원 탈퇴]를 누르기 전까지 계정 데이터는 전혀 바뀌지 않습니다.
      본인 확인 단계도 verifyPassword 만 호출합니다.
   ⚠️ 차단 조건 · 유예 기간은 SPAuth.CONFIG.withdraw 플래그로만 결정됩니다.
      확정되지 않은 삭제 기간 · 환불 기간 · 재화 소멸 규칙 · 재가입 제한
      기간은 만들어 내지 않았습니다.
   ══════════════════════════════════════════════════════════════════ */

/* 탈퇴 안내 — 확정되지 않은 기간·규칙은 넣지 않고 "정책에 따릅니다"로 둡니다 */
/* 탈퇴 사유 — 선택 항목입니다 (필수 아님) */

var wdStep = 0;          /* 0 없음 · 1 본인확인 · 2 안내·동의 · 3 잔여 재화 · 4 완료 */
var wdPre = null;        /* precheck 결과 캐시 */
var wdAgreed = { a1:false, a2:false };
var wdVerified = false;  /* ①을 통과했는가 */
var wdPw = '';
var wdReason = '', wdReasonEtc = '';
var wdDone = false;

function wdReset() {
  wdStep = 0; wdPre = null; wdVerified = false; wdPw = '';
  wdAgreed = { a1:false, a2:false }; wdReason = ''; wdReasonEtc = ''; wdDone = false;
}

/* ── ① 정보 다시 입력 / 본인 확인 ──────────────────────────────── */
function ViewWithdrawAuth() {
  var frag = document.createDocumentFragment();
  frag.appendChild(BackBtn(T('계정'), function () { wdReset(); swap(render); }));

  var c = Card(T('회원 탈퇴'), T('회원 탈퇴를 위해 계정 정보를 다시 한번 확인해주세요.'));
  var form = el('div', 'mpform');
  var pw = wdPw;

  var fields = el('div', 'mpfields');
  fields.appendChild(Field({ id:'wdEmail', label:T('이메일'), value:me.email, readonly:true,
    hint:T('현재 로그인된 계정입니다.') }));
  var fPw = Field({ id:'wdPw', label:T('현재 비밀번호'), password:true, autocomplete:'current-password',
    ph:T('현재 비밀번호를 입력해주세요.'),
    onInput:function (v, w) { pw = v; w.setMsg(''); sync(); } });
  if (pw) fPw.__input.value = pw;
  fields.appendChild(fPw);
  form.appendChild(fields);

  var acts = ActionRow(T('취소'), T('확인'),
    function () { wdReset(); swap(render); },
    function () {
      acts.__ok.setLoading(true, T('확인 중'));
      /* ⚠️ 확인만 합니다 — 계정 데이터는 바뀌지 않습니다 */
      SPAuth.verifyPassword(pw)
        .then(function () {
          acts.__ok.setLoading(false);
          wdVerified = true; wdPw = pw; wdStep = 2; swap(render);
        })
        .catch(function (err) {
          acts.__ok.setLoading(false);
          fPw.setMsg(err.message === 'wrongPassword'
            ? T('비밀번호가 일치하지 않습니다.')
            : T('확인하지 못했어요. 잠시 후 다시 시도해주세요.'), 'err');
          fPw.__input.focus();
        });
    });
  acts.__ok.disabled = !pw;
  form.appendChild(acts);
  function sync() { acts.__ok.disabled = !pw; }

  c.__body.appendChild(form);
  frag.appendChild(c);
  return frag;
}

/* ── ② 회원 탈퇴 안내 + 하단 필수 동의 ─────────────────────────── */

/* ── ③ 잔여 재화 확인 + ④ 탈퇴 취소 / 회원 탈퇴 ────────────────── */
function ViewWithdrawAssets() {
  var frag = document.createDocumentFragment();
  frag.appendChild(BackBtn(T('회원 탈퇴 안내'), function () { wdStep = 2; swap(render); }));

  var c = Card(T('잔여 재화를 확인해주세요'), T('회원 탈퇴 전에 현재 계정에 남아 있는 재화를 확인해주세요.'));
  var form = el('div', 'mpform mpform--wide');
  c.__body.appendChild(form);

  var slot = el('div', null);
  form.appendChild(slot);
  slot.appendChild(el('p', 'wdchk__load', T('계정 상태를 확인하는 중이에요…')));

  var acts = ActionRow(T('탈퇴 취소'), T('회원 탈퇴'),
    function () { wdReset(); swap(render); },
    function () { finalConfirm(); });
  acts.__ok.classList.add('abtn--danger');
  acts.__ok.disabled = true;
  var blockMsg = el('p', 'wdblock', ''); blockMsg.hidden = true;
  form.appendChild(blockMsg);
  form.appendChild(acts);
  frag.appendChild(c);

  function paint(pre) {
    slot.textContent = '';
    var b = SPAuth.getBilling();

    /* 보유 재화 */
    var g1 = el('div', 'mpgroup');
    g1.appendChild(el('p', 'mpgroup__h', T('보유 재화')));
    var body1 = el('div', 'mpgroup__b');
    var grid = el('div', 'mpassets');
    CONFIG.assets.forEach(function (a) {
      var v = b.assets[a.id] || { total:0, payable:0 };
      var card = el('div', 'mpasset');
      var top = el('div', 'mpasset__top');
      top.appendChild(el('span', 'mpasset__mark', a.mark));
      top.appendChild(el('span', 'mpasset__name', T(a.ko)));
      card.appendChild(top);
      var tot = el('p', 'mpasset__total', num(v.total));
      tot.appendChild(el('i', null, T(a.ko)));
      card.appendChild(tot);
      if (payable(a.id) && v.payable > 0) {
        var sub = el('div', 'mpasset__sub');
        sub.appendChild(el('span', null, T('정산 가능')));
        sub.appendChild(el('b', null, num(v.payable)));
        card.appendChild(sub);
      }
      grid.appendChild(card);
    });
    body1.appendChild(grid);
    var n1 = el('ul', 'wdnote');
    n1.appendChild(el('li', null, T('탈퇴 후 보유 재화의 이용 및 복구가 제한될 수 있으니 탈퇴 전에 반드시 확인해주세요.')));
    n1.appendChild(el('li', null, T('재화의 소멸 · 환불 여부는 슈퍼플랫 운영 정책에 따릅니다.')));
    body1.appendChild(n1);
    g1.appendChild(body1);
    slot.appendChild(g1);

    /* 확인이 필요한 항목만 추립니다 — 필요 이상으로 복잡하게 보여주지 않습니다 */
    var flagged = pre.items.filter(function (i) {
      return i.state === 'warn' && i.id !== 'assets' && i.id !== 'cards' && i.id !== 'content';
    });
    if (flagged.length) {
      var g2 = el('div', 'mpgroup');
      g2.appendChild(el('p', 'mpgroup__h', T('탈퇴 전 확인이 필요한 항목')));
      var body2 = el('div', 'mpgroup__b');
      var list = el('div', 'wdlist');
      flagged.forEach(function (it) { list.appendChild(wdRow(it)); });
      body2.appendChild(list);
      g2.appendChild(body2);
      slot.appendChild(g2);
    }

    /* 탈퇴 사유 (선택) */
    var g3 = el('div', 'mpgroup');
    var h3 = el('p', 'mpgroup__h', T('탈퇴 사유'));
    h3.appendChild(el('span', 'mpgroup__opt', T('선택')));
    g3.appendChild(h3);
    g3.appendChild(el('p', 'mpgroup__d', T('알려주시면 서비스를 개선하는 데 참고하겠습니다.')));
    var body3 = el('div', 'mpgroup__b');
    var radios = el('div', 'wdreasons');
    radios.setAttribute('role', 'radiogroup');
    radios.setAttribute('aria-label', T('탈퇴 사유'));
    var etcField = null;
    WD_REASONS.forEach(function (r) {
      var l = el('label', 'rad wdreason');
      var i = document.createElement('input');
      i.type = 'radio'; i.name = 'wdReason'; i.value = r; i.checked = wdReason === r;
      l.appendChild(i); l.appendChild(el('span', 'rad__mark')); l.appendChild(el('span', null, r));
      i.addEventListener('change', function () {
        wdReason = r;
        if (etcField) etcField.hidden = r !== '기타';
      });
      radios.appendChild(l);
    });
    body3.appendChild(radios);
    etcField = AreaField({ id:'wdEtc', label:'', ph:T('직접 입력해 주세요.'),
      onInput:function (v) { wdReasonEtc = v; } });
    etcField.querySelector('.fld__label').remove();
    etcField.classList.add('wdreason__etc');
    etcField.hidden = wdReason !== '기타';
    if (wdReasonEtc) etcField.__input.value = wdReasonEtc;
    body3.appendChild(etcField);
    g3.appendChild(body3);
    slot.appendChild(g3);

    acts.__ok.disabled = pre.blocked;
    blockMsg.hidden = !pre.blocked;
    blockMsg.textContent = pre.blocked
      ? T('탈퇴 전에 처리해야 하는 항목이 있습니다. 위 항목을 확인한 뒤 다시 시도해주세요.') : '';
  }

  if (wdPre) paint(wdPre);
  else SPAuth.withdrawPrecheck().then(function (pre) { wdPre = pre; paint(pre); });

  /* ── ⑤ 최종 확인 ── */
  function finalConfirm() {
    Confirm({
      title:T('회원 탈퇴를 진행할까요?'),
      desc:T('탈퇴 후에는 계정 및 관련 정보에 다시 접근할 수 없을 수 있습니다. 잔여 재화와 이용 중인 서비스를 모두 확인했는지 다시 한번 확인해주세요.'),
      rows:[[T('계정'), me.email], [T('닉네임'), me.nick || me.name || '—']],
      cancel:T('취소'), ok:T('회원 탈퇴'), danger:true
    }).then(function (ok) {
      if (!ok) return;
      acts.__ok.setLoading(true, T('처리 중'));
      /* 세션이 사라지면서 change 이벤트가 먼저 오므로 플래그를 미리 세웁니다 */
      wdDone = true;
      SPAuth.withdraw({ password:wdPw })
        .then(function () { wdStep = 4; swap(render); })
        .catch(function () {
          wdDone = false;
          acts.__ok.setLoading(false);
          blockMsg.hidden = false;
          blockMsg.textContent = T('탈퇴를 처리하지 못했어요. 잠시 후 다시 시도해주세요.');
        });
    });
  }
  return frag;
}

/* ── ⑥ 완료 ────────────────────────────────────────────────────── */
function ViewWithdrawDone() {
  return DoneView(T('회원 탈퇴가 완료되었습니다.'),
    T('그동안 슈퍼플랫을 이용해주셔서 감사합니다.'),
    T('홈으로 이동'), function () { location.replace('index.html'); });
}

function wdIcon(state) {
  var g = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  g.setAttribute('viewBox', '0 0 24 24'); g.setAttribute('aria-hidden', 'true');
  g.setAttribute('class', 'wdchk__i is-' + state);
  g.innerHTML = state === 'ok'   ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
              : state === 'warn' ? '<path d="M12 8v5"/><circle cx="12" cy="16.6" r="1"/><circle cx="12" cy="12" r="9"/>'
              :                    '<path d="M6 12h12"/>';
  return g;
}

/* 사전 점검 항목 한 줄 */
function wdRow(it) {
  var row = el('div', 'wdchk');
  var head = el('div', 'wdchk__h');
  head.appendChild(wdIcon(it.state));
  var t = el('div', 'wdchk__t');
  t.appendChild(el('p', 'wdchk__n', it.label));
  t.appendChild(el('p', 'wdchk__s', WD_STATE_KO[it.state] + (it.blocking ? T(' · 탈퇴 전 처리 필요') : '')));
  head.appendChild(t);
  if (it.link) {
    var go = el('button', 'mpbtn-s', linkLabel(it.id)); go.type = 'button';
    go.addEventListener('click', function () {
      /* it.link 는 예전 'cash/xxx' 형식 — 새 IA 의 페이지 id 로 옮깁니다 */
      var parts = it.link.split('/');
      var page = menuItem(parts[1]) ? parts[1] : 'assets';
      wdStep = 0; cashView = null; tab = page;
      history.replaceState(null, '', '#' + page);
      buildNav(); swap(render);
    });
    head.appendChild(go);
  }
  row.appendChild(head);
  var d = wdDetail(it);
  if (d) row.appendChild(d);
  if (it.blocking) row.appendChild(el('p', 'wdchk__block', T('이 항목이 처리되어야 탈퇴를 진행할 수 있습니다.')));
  return row;
}
function linkLabel(id) {
  return id === 'payable' || id === 'payout' ? T('정산 관리')
       : id === 'refund' ? T('환불 내역')
       : id === 'sub' ? T('구독 관리')
       : id === 'cards' ? T('결제 수단') : T('자세히 보기');
}
function wdDetail(it) {
  if (!it.detail) return null;
  var box = el('dl', 'wdchk__d');
  function line(k, v) {
    var r = el('div'); r.appendChild(el('dt', null, k)); r.appendChild(el('dd', null, v)); box.appendChild(r);
  }
  if (it.id === 'assets' || it.id === 'payable') {
    it.detail.forEach(function (a) { line(T(a.ko), num(a.n)); });
  } else if (it.id === 'payout') {
    it.detail.forEach(function (p) {
      line(T(assetById(p.asset).ko) + ' ' + num(p.qty), (PAYOUT_STATUS[p.status] || ['—'])[0]);
    });
  } else if (it.id === 'refund') {
    it.detail.forEach(function (r) { line(T('환불 요청 ') + r.date, T('검토 중')); });
  } else if (it.id === 'sub') {
    var pl = planById(it.detail.planId);
    line(T('이용 중인 구독'), pl ? T(pl.ko) : '—');
    line(T('다음 결제일'), it.detail.nextBilling || '—');
  } else if (it.id === 'cards') {
    it.detail.forEach(function (c) { line(c.brand, '**** ' + c.last4); });
  } else if (it.id === 'content') {
    line(T('마이스페이스'), num(it.detail.spaces));
    line(T('게시 콘텐츠'), num(it.detail.posts));
  } else if (it.id === 'payment') {
    it.detail.forEach(function (p) { line(T('결제 ') + p.date, T('처리 중')); });
  }
  return box.children.length ? box : null;
}


/* ══ 2. 계정 ═══════════════════════════════════════════════════════ */
function ViewAccount() {
  var frag = document.createDocumentFragment();

  var c1 = Card(T('로그인 정보'), T('이 계정으로 슈퍼플랫에 로그인하고 있어요.'));

    var d = el('div');

  frag.appendChild(c1);

  /* 비밀번호 — 로그인·보안 정보이므로 프로필이 아니라 여기에 둡니다 */
  frag.appendChild(PasswordCard());

  /* 연결된 계정 — 소셜 로그인이 실제로 지원되지 않으므로 UI 를 만들지 않습니다.
     (실제 기능이 없는 화면을 임의로 추가하지 않는다는 원칙) */

  /* ── Danger zone — 프로필 수정 · 비밀번호 변경과 충분히 떨어뜨립니다 ── */
  var c2 = Card(T('회원 탈퇴'));
  c2.classList.add('mpcard--danger');
  var dz = el('div', 'mpdanger');
  dz.appendChild(el('p', 'mpdanger__t', T('계정 삭제')));

var PLANS = CONFIG.plans, MATRIX = CONFIG.planMatrix, ASSETS = CONFIG.assets;

function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function payable(assetId) { return PAYOUT.payableAssets.indexOf(assetId) > -1; }

/* Select 필드 — Field() 와 똑같은 라벨/박스/헬퍼 구조를 씁니다.
   .selct 는 .inp 과 height · padding · radius · border 가 동일합니다. */
function SelectField(o) {
  var wrap = el('div', 'fld');
  var lab = el('label', 'fld__label', o.label); lab.htmlFor = o.id;
  wrap.appendChild(lab);
  var box = el('div', 'fld__box');
  var sel = document.createElement('select');
  sel.className = 'selct'; sel.id = o.id;
  (o.options || []).forEach(function (op) {
    var e = document.createElement('option');
    e.value = op.v; e.textContent = op.t; e.selected = !!op.on;
    sel.appendChild(e);
  });
  box.appendChild(sel); wrap.appendChild(box);
  var msg = el('p', 'fld__msg'); msg.id = o.id + '-msg';
  if (o.hint) msg.textContent = o.hint;
  wrap.appendChild(msg);
  wrap.__input = sel; wrap.__msg = msg; wrap.__box = box;
  wrap.setMsg = function (t, k) {
    msg.textContent = t || '';
    msg.className = 'fld__msg' + (k === 'err' ? ' is-err' : k === 'ok' ? ' is-ok' : '');
  };
  if (o.onChange) sel.addEventListener('change', function () { o.onChange(sel.value, wrap); });
  return wrap;
}
/* 숫자 입력 뒤에 붙는 단위 — 입력창 안쪽 오른쪽에 붙입니다.
   옆에 버튼(전액)이 있어도 겹치지 않도록 input 을 감싼 래퍼 기준으로 배치. */
function setUnit(field, text) {
  var u = field.__box.querySelector('.fld__unit');
  if (!u) {
    var wrap = el('span', 'inpwrap');
    field.__input.parentNode.insertBefore(wrap, field.__input);
    wrap.appendChild(field.__input);
    field.__input.classList.add('inp--unit');
    u = el('span', 'fld__unit');
    wrap.appendChild(u);
  }
  u.textContent = text;
  return u;
}
/* Textarea 필드 — .inp 과 같은 규격, 높이만 다름 */
function AreaField(o) {
  var wrap = el('div', 'fld');
  var lab = el('label', 'fld__label', o.label); lab.htmlFor = o.id;
  wrap.appendChild(lab);
  var box = el('div', 'fld__box');

  box.appendChild(ta); wrap.appendChild(box);
  var msg = el('p', 'fld__msg'); msg.id = o.id + '-msg';

  wrap.setMsg = function (t, k) { msg.textContent = t || ''; msg.className = 'fld__msg' + (k ? ' is-' + k : ''); };
  if (o.onInput) ta.addEventListener('input', function () { o.onInput(ta.value, wrap); });
  return wrap;
}

/* 취소 / 확인 두 버튼 — 크기·radius·폰트가 항상 동일합니다 */
function ActionRow(cancelLabel, okLabel, onCancel, onOk, opt) {
  opt = opt || {};
  var row = el('div', 'mpacts');

  c.addEventListener('click', onCancel);

/* 공용 확인 다이얼로그 */
function Confirm(o) {
  return new Promise(function (res) {
    var wrap = el('div', 'mpdlg mpdlg--live');
    wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true');
    var dim = el('div', 'mpdlg__dim');
    var box = el('div', 'mpdlg__box mpdlg__box--wide');
    box.appendChild(el('p', 'mpdlg__t', o.title));
    if (o.desc) box.appendChild(el('p', 'mpdlg__d', o.desc));
    if (o.rows && o.rows.length) {
      var dl = el('dl', 'mpdlg__list');
      o.rows.forEach(function (r) {
        var d = el('div');
        d.appendChild(el('dt', null, r[0]));
        d.appendChild(el('dd', null, r[1]));
        dl.appendChild(d);
      });
      box.appendChild(dl);
    }
    var acts = el('div', 'mpdlg__a');
    var no = Button(o.cancel || T('취소'), { ghost:true, onClick:function () { close(false); } });
    var yes = Button(o.ok || T('확인'), { onClick:function () { close(true); } });
    if (o.danger) yes.classList.add('abtn--danger');
    acts.appendChild(no); acts.appendChild(yes);
    box.appendChild(acts);
    wrap.appendChild(dim); wrap.appendChild(box);
    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add('is-in'); });
    no.focus();
    function key(e) { if (e.key === 'Escape') close(false); }
    document.addEventListener('keydown', key);
    dim.addEventListener('click', function () { close(false); });
    function close(v) {
      document.removeEventListener('keydown', key);
      wrap.classList.remove('is-in');
      setTimeout(function () { wrap.remove(); }, reduce ? 0 : 220);
      res(v);
    }
  });
}

/* 짧은 토스트 — 저장 결과를 버튼에 붙잡아 두지 않습니다 */

/* 약관 전문 — 긴 글이라 모달이 아니라 전체 페이지로 보여줍니다 */
function ViewLegal(id) {
  var t = null;
  for (var i = 0; i < LEGAL.length; i++) if (LEGAL[i].id === id) t = LEGAL[i];
  var frag = document.createDocumentFragment();
  if (!t) { legalOpen = null; return ViewTerms(); }

  t.body.split('\n').forEach(function (line) {

function PanePayout() {
  var b = SPAuth.getBilling();
  var frag = document.createDocumentFragment();

  frag.appendChild(Notice(T('환불과 정산은 다릅니다'),

/* ── 하위 화면 라우팅 ─────────────────────────────────────────────── */
/* 하위 화면 → 부모 페이지. 부모가 이제 좌측 내비게이션 항목이므로
   메뉴 선택 상태와 주소도 함께 맞춰 줍니다. */
function backToCash(page) {
  cashView = null;
  if (page && menuItem(page) && page !== tab) {
    tab = page;
    history.replaceState(null, '', '#' + page);
    buildNav();
  }
  swap(render);
}
function CashSub() {
  var v = cashView;
  return v.name === 'payoutReq'    ? SubPayoutRequest(v) :
         v.name === 'account'      ? SubPayoutAccount(v) :
         v.name === 'payoutDetail' ? SubPayoutDetail(v)  :
         v.name === 'txDetail'     ? SubTxDetail(v)      :
         v.name === 'refund'       ? SubRefund(v)        :
         v.name === 'plans'        ? SubPlans(v)         :
         v.name === 'payMethod'    ? SubPayMethod(v)     :
         v.name === 'addCard'      ? SubAddCard(v)       :
         v.name === 'payDetail'    ? SubPayDetail(v)     :
         v.name === 'done'         ? SubDone(v)          : Empty(T('화면을 찾을 수 없어요'), '');
}
function SubDone(v) {
  return DoneView(v.title, v.desc, v.cta || T('확인'), function () { backToCash(v.back); });
}

/* 정산 요청 — 폼 → 예상 정산 정보 → 정산 계좌 → CTA 한 흐름
   모든 입력 요소가 .mpform(680px) 안에서 같은 좌우 기준선을 씁니다. */
function SubPayoutRequest(v) {
  var b = SPAuth.getBilling();
  var frag = document.createDocumentFragment();
  var sel = v.asset || PAYOUT.payableAssets[0];
  var qty = 0;

  frag.appendChild(BackBtn(T('정산 관리'), function () { backToCash('payout'); }));
  var c = Card(T('정산 요청'), T('정산 가능한 재화만 신청할 수 있어요.'));
  var form = el('div', 'mpform');
  c.__body.appendChild(form);

  /* ── 그룹 1 : 입력 ── */
  var g1 = el('div', 'mpgroup');
  var fields = el('div', 'mpfields');

  var fAsset = SelectField({ id:'poAsset', label:T('정산할 재화'),
    options: PAYOUT.payableAssets.map(function (id) {
      return { v:id, t:T(assetById(id).ko), on:id === sel };
    }),
    onChange:function (val) { sel = val; qty = 0; fQty.__input.value = ''; fQty.setMsg(''); paint(); } });

  var fQty = Field({ id:'poQty', label:T('정산 요청 수량'), inputmode:'numeric', ph:'0',
    side:{ text:T('전액'), onClick:function () {
      qty = maxQty();
      fQty.__input.value = qty ? num(qty) : '';
      fQty.setMsg(qty ? T('정산 가능한 전체 수량이에요.') : '', qty ? 'ok' : '');
      paint();
    } },
    onInput:function (val, w) {
      var max = maxQty();
      var n = Math.min(max, Math.floor(Number(String(val).replace(/[^\d]/g, '')) || 0));
      qty = n;
      w.__input.value = n ? num(n) : '';
      w.setMsg(n > 0 && n === max ? T('정산 가능한 전체 수량이에요.') : '', n > 0 && n === max ? 'ok' : '');
      paint();
    } });

  fields.appendChild(fAsset); fields.appendChild(fQty);
  g1.appendChild(fields);
  form.appendChild(g1);

  /* ── 그룹 2 : 예상 정산 정보 ── */
  var g2 = el('div', 'mpgroup');
  g2.appendChild(el('p', 'mpgroup__h', T('예상 정산 정보')));
  g2.appendChild(el('p', 'mpgroup__d', T('환산 금액 · 수수료 · 공제는 정산 정책이 확정된 뒤 계산됩니다.')));
  var sumBox = el('div', 'mpgroup__b');
  var sum = el('dl', 'mpsum');
  function sumRow(k, valNode, total) {
    var r = el('div', 'mpsum__r' + (total ? ' mpsum__r--total' : ''));
    r.appendChild(el('dt', null, k));
    var dd = el('dd', null); dd.appendChild(valNode); r.appendChild(dd);
    return r;
  }
  var vQty = el('span', null, '0');
  var mk = function (t) { return el('span', 'tbd', t); };
  sum.appendChild(sumRow(T('정산 요청 재화'), vQty));
  sum.appendChild(sumRow(T('환산 금액'), mk(TBD)));
  sum.appendChild(sumRow(T('수수료'), mk(TBD)));
  sum.appendChild(sumRow(T('세금 · 공제'), mk(TBD)));
  sum.appendChild(sumRow(T('예상 지급 금액'), mk(TBD), true));
  sumBox.appendChild(sum); g2.appendChild(sumBox);
  form.appendChild(g2);

  /* ── 그룹 3 : 정산 계좌 ── */
  var g3 = el('div', 'mpgroup');
  g3.appendChild(el('p', 'mpgroup__h', T('정산 받을 계좌')));
  var accWrap = el('div', 'mpgroup__b');
  var accBox = el('div', 'mpbox');
  var accT = el('div', 'mpbox__t');
  accBox.appendChild(accT);
  var accBtn = el('button', 'mpbtn-s', ''); accBtn.type = 'button';
  accBtn.addEventListener('click', function () { cashView = { name:'account', from:{ name:'payoutReq', asset:sel } }; swap(render); });
  accBox.appendChild(accBtn);
  accWrap.appendChild(accBox); g3.appendChild(accWrap);
  form.appendChild(g3);

  var acts = ActionRow(T('취소'), T('정산 요청'),
    function () { backToCash('payout'); },
    function () { submit(); });
  form.appendChild(acts);
  frag.appendChild(c);

  function maxQty() { return (b.assets[sel] || {}).payable || 0; }
  function paint() {
    var a = b.assets[sel] || { total:0, payable:0 }, ko = T(assetById(sel).ko);
    setUnit(fQty, ko);
    fQty.__msg.dataset.hold = '1';
    fAsset.setMsg(T('보유 ') + num(a.total) + T(' · 정산 가능 ') + num(a.payable) + ' ' + ko);
    vQty.textContent = num(qty) + ' ' + ko;
    accT.textContent = '';
    accT.appendChild(el('p', 'mpbox__k', T('정산 계좌')));
    if (b.payoutAccount) {
      var pv = el('p', 'mpbox__v', b.payoutAccount.bank + ' ' + b.payoutAccount.holder + ' ');
      pv.appendChild(el('span', null, '**** ' + b.payoutAccount.last4));
      accT.appendChild(pv);
      accBtn.textContent = T('변경');
    } else {
      accT.appendChild(el('p', 'mpbox__v', T('정산 받을 계좌를 등록해주세요.')));
      accBtn.textContent = T('+ 정산 계좌 등록');
    }
    acts.__ok.disabled = !(qty > 0 && b.payoutAccount);
  }
  paint();

  function submit() {
    Confirm({
      title:T('정산을 요청하시겠어요?'),
      desc:T('환산 금액과 수수료는 정산 정책이 확정된 뒤 안내됩니다.'),
      rows:[[T('정산 재화'), num(qty) + ' ' + T(assetById(sel).ko)],
            [T('예상 지급 금액'), TBD],
            [T('정산 계좌'), b.payoutAccount.bank + ' ****' + b.payoutAccount.last4]],
      cancel:T('취소'), ok:T('정산 요청')

  thead.appendChild(htr); tbl.appendChild(thead);

      var td = document.createElement('td');

            [T('결제 수단'), (function () {
              var cd = b.cards.filter(function (x) { return x.id === (b.subscription || {}).cardId; })[0];
              return cd ? cd.brand + ' ****' + cd.last4 : T('등록된 카드 없음');
            })()]],
      cancel:T('취소'), ok:T('변경하기')

      if (!ok) return;

          cta:T('구독 관리로') };

  if (notice2) form.appendChild(notice2);
  var fields = el('div', 'mpfields'); fields.style.marginTop = '24px';
  var fBrand = SelectField({ id:'cdBrand', label:T('카드사'),
    options:[{ v:'', t:T('카드사를 선택해주세요.'), on:true }].concat(
      CARD_BRANDS.map(function (bn) { return { v:bn, t:bn }; })),
    onChange:function (val) { d.brand = val; sync(); } });

  var fNo = Field({ id:'cdNo', label:T('카드번호'), inputmode:'numeric', maxlength:19,
    ph:'0000 0000 0000 0000', hint:T('끝 4자리만 저장됩니다.'),
    onInput:function (x, w) {
      var v = String(x).replace(/[^\d]/g, '').slice(0, 16);
      d.no = v;
      w.__input.value = v.replace(/(.{4})/g, '$1 ').trim();
      sync();
    } });
  var fExp = Field({ id:'cdExp', label:T('유효기간'), inputmode:'numeric', maxlength:5, ph:'MM/YY',
    onInput:function (x, w) {
      var v = String(x).replace(/[^\d]/g, '').slice(0, 4);
      d.exp = v;
      w.__input.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
      sync();
    } });
  fields.appendChild(fBrand); fields.appendChild(fNo); fields.appendChild(fExp);
  form.appendChild(fields);
  c.__body.appendChild(form);

  var acts = ActionRow(T('취소'), T('카드 등록'),
    function () { backToCash('pay'); },
    function () {
      acts.__ok.setLoading(true, T('등록 중'));
      /* 끝 4자리만 넘깁니다 — 전체 번호는 어디에도 보내지 않습니다 */
      SPAuth.addCard({ brand:d.brand, last4:d.no.slice(-4) }).then(function (r) {
        if (replaceId && r && r.card) return SPAuth.setDefaultCard(r.card.id).then(function () { backToCash('pay'); });
        backToCash('pay');
      });
    });
  acts.__ok.disabled = true;
  form.appendChild(acts);
  function sync() { acts.__ok.disabled = !(d.brand && d.no.length === 16 && d.exp.length === 4); }
  frag.appendChild(c);
  return frag;
}

/* 결제 상세 */
function SubPayDetail(v) {
  var b = SPAuth.getBilling();
  var p = b.payments.filter(function (x) { return x.id === v.id; })[0];
  var frag = document.createDocumentFragment();
  if (!p) { backToCash('sub'); return frag; }
  var pl = planById(p.planId), cd = b.cards.filter(function (x) { return x.id === p.cardId; })[0];

  frag.appendChild(BackBtn(T('구독 관리'), function () { backToCash('sub'); }));
  var c = Card(T('결제 상세'));
  var top = el('div', null);
  top.appendChild(Badge(p.status === 'paid' ? T('결제 완료') : T('결제 취소'), p.status === 'paid' ? 'ok' : 'err'));
  c.__body.appendChild(top);

  var dl = el('dl', 'mpdl');
  [[T('상품명'), (pl ? T(pl.ko) : '') + T(' 구독')],
   [T('결제일'), p.date],
   [T('결제금액'), pl ? won(pl.price) : '—'],
   [T('결제수단'), cd ? cd.brand + ' **** ' + cd.last4 : '—'],
   [T('주문번호'), 'SP-' + p.id.toUpperCase()]
  ].forEach(function (r) {
    var d = el('div'); d.appendChild(el('dt', null, r[0]));
    var dd = el('dd', null); dd.appendChild(el('span', null, r[1])); d.appendChild(dd); dl.appendChild(d);
  });
  var wrapP = el('div', 'mpform'); wrapP.style.marginTop = '20px'; wrapP.appendChild(dl);
  wrapP.appendChild(el('p', 'mpcard__d', T('환불 가능 여부는 결제 및 이용 상태에 따라 달라질 수 있습니다. 영수증 발급은 결제 대행사 연동 후 제공됩니다.')));
  var one = el('div', 'mpacts mpacts--single');
  one.appendChild(Button(T('목록으로'), { onClick:function () { backToCash('sub'); } }));
  wrapP.appendChild(one);
  c.__body.appendChild(wrapP);
  frag.appendChild(c);
  return frag;
}

/* ══ 4~6. 정책 미확정 영역 ═════════════════════════════════════════
   캐시 / 수익 / 콘텐츠는 실제 SuperPlat 의 기능·정책·수수료가 확정되지
   않았습니다. 가상의 금액이나 정산 데이터를 만들지 않고, 화면 구조와
   빈 상태만 준비해 둡니다.                                            */
function ViewPending(id) {
  var m = { revenue:{ t:T('수익 관리'),
                   d:T('판매 수익과 정산 내역이 이곳에 표시됩니다.') },
            content:{ t:T('콘텐츠 관리'),
                   d:T('내가 만든 공간과 아이템이 이곳에 표시됩니다.') } }[id];
  var frag = document.createDocumentFragment();
  var c = Card(m.t);
  var e = Empty(T('아직 표시할 내용이 없어요'), m.d);
  c.__body.appendChild(e);
  frag.appendChild(c);
  return frag;
}

/* ── 렌더 ───────────────────────────────────────────────────────── */
var VIEWS = {
  profile:ViewProfile, terms:ViewTerms,  account:ViewAccount,
  assets:PaneAssets,   sub:PaneSub,      pay:PanePay,
  ledger:PaneLedger,   payout:PanePayout
};
/* 모든 화면이 같은 헤더(제목 + 설명) 위에서 시작합니다.
   하위 화면(정산 요청 · 환불 요청 · 카드 등록 …)에서는 설명을 비우고
   화면 안의 되돌아가기 버튼이 위치를 알려 줍니다. */
function setHead(title, desc) {
  $('#mpTitle').textContent = title;
  var s = $('#mpSub');
  s.textContent = desc || '';
  s.hidden = !desc;
  document.title = title + T(' — 마이페이지 · SuperPlat');
}
function render() {
  bodyEl.textContent = '';
  var meta = PAGE[tab] || PAGE.profile;

  if (tab === 'account' && wdStep) {
    bodyEl.appendChild(wdStep === 1 ? ViewWithdrawAuth()
                     : wdStep === 2 ? ViewWithdrawNotice()
                     : wdStep === 3 ? ViewWithdrawAssets()
                     : ViewWithdrawDone());
    setHead(T('회원 탈퇴'), '');
    return;
  }
  if (cashView) {                       /* 결제 그룹의 하위 화면 */
    bodyEl.appendChild(CashSub());
    setHead(meta.label, '');
    return;
  }
  bodyEl.appendChild(VIEWS[tab] ? VIEWS[tab]() : ViewPending(tab));
  setHead(meta.label, meta.desc);
}

/* 다른 탭/창에서 로그아웃되면 즉시 로그인 화면으로 */
SPAuth.on(function (u) {
  /* 탈퇴 완료 화면에서는 세션이 사라지는 게 정상이라 리다이렉트하지 않습니다 */
  if (!u) { if (wdDone) return; dirty = false; location.replace('auth.html'); return; }
  me = u;
});

buildNav();
render();

/* 헤더에서 언어를 바꾸면 마이페이지 전체를 현재 화면 그대로 다시 그립니다.
   (탭 · 하위 화면 · 탈퇴 단계는 상태 변수에 있으므로 그대로 유지됩니다) */
window.__mpRender = function () {
  rebuildI18n();
  buildNav();
  render();
};

})();
</script>
</body>
